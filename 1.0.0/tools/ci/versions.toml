# Werkzeugversionen der CI (TOOL-03) - die EINZIGE Stelle, an der sie festgelegt sind.
#
# Lokal und in CI gleich: `python -m tools.ci setup` laedt genau diese Archive (SHA-256 geprueft) in den
# Werkzeug-Cache (NX_CI_CACHE, sonst %LOCALAPPDATA%/nextbsw/ci-cache bzw. ~/.cache/nextbsw/ci-cache), und
# `python -m tools.ci run` stellt sie jedem Test und Target-Build vorne in den PATH. Mit `--toolchain local`
# laeuft dieselbe Pipeline mit den Werkzeugen des Arbeitsplatzes; `check` nennt dann jede Abweichung.
#
# Weitere Festlegungen im selben Ordner (je Wert genau einmal):
#   .python-version   Python-Interpreter (auch von actions/setup-python gelesen)
#   constraints.txt   exakte Versionen aller Python-Pakete zu tools/requirements.txt
#
# Aendern: Version, URLs und sha256 gemeinsam tauschen, dann `python -m tools.ci setup` und einen vollstaendigen
# Lauf `python -m tools.ci run --clean`. Ein neuer ARM-GCC muss die Target-Builds warnungsfrei (-Werror) bauen.

schema = 1

[tools.arm_gcc]
# xPack GNU Arm Embedded GCC: frei beziehbar (GitHub, ohne Anmeldung), fuer Windows und Linux gleich gebaut.
# Arbeitsplatz bisher: GCC 11.4 aus S32 Design Studio 3.6.9 (NXP-Build, nur mit NXP-Konto). Naechste frei
# beziehbare Version derselben Hauptversion ist 11.3.1 - Befund und Messwerte in doc/changelog.d/TOOL-03.md.
version = "11.3.1"
probe = ["arm-none-eabi-gcc", "-dumpversion"]
bin = "bin"
[tools.arm_gcc.windows]
url = "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v11.3.1-1.1/xpack-arm-none-eabi-gcc-11.3.1-1.1-win32-x64.zip"
sha256 = "d3906baa7a845bb8f341b67da8185e48fb9dc2746963bf40c2caea825c73ee5c"
[tools.arm_gcc.linux]
url = "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v11.3.1-1.1/xpack-arm-none-eabi-gcc-11.3.1-1.1-linux-x64.tar.gz"
sha256 = "df515ea5b2efb625f1cf1e11c3d096c4ddf800408ee2bd061a67b7739a5febff"

[tools.cmake]
version = "4.4.3"
probe = ["cmake", "--version"]
bin = "bin"
[tools.cmake.windows]
url = "https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-windows-x86_64.zip"
sha256 = "4d52ebab7193a698651639ed80d8d04fd903358843572cf44c7fd234cb7c26ab"
[tools.cmake.linux]
url = "https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-x86_64.tar.gz"
sha256 = "d6c83076c575bc00b823522ac974bda66d0af05d6ddc30e739c12385cf32c6cc"

[tools.ninja]
version = "1.13.2"
probe = ["ninja", "--version"]
bin = "."
[tools.ninja.windows]
url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip"
sha256 = "07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65"
[tools.ninja.linux]
url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip"
sha256 = "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6"

# Nur fuer `python -m tools.ci lint` (Syntaxpruefung der Workflow-Huelle), nicht fuer Tests und Builds.
[tools.actionlint]
version = "1.7.12"
probe = ["actionlint", "-version"]
bin = "."
optional = true
[tools.actionlint.windows]
url = "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip"
sha256 = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
[tools.actionlint.linux]
url = "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
sha256 = "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
