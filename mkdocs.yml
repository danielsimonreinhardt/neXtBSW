  - Start: README.md
  - Wegweiser: doc/README.md
  - Integrator:
      - Anleitung: doc/guide/README.md
      - Erste Schritte: doc/guide/getting-started.md
      - Host-Durchlauf ohne Hardware: doc/guide/host-durchlauf.md
