# Documentation website (DOC-71): MkDocs Material over the Markdown + Mermaid sources of the repository.
# Packages: pip install -r tools/requirements-site.txt. Build only through the export (published pages, links to
# unpublished pages replaced): python -m tools.docgen.site build --out <dir>. Details: tools/docgen/README.md.
site_name: neXtBSW
site_description: Hardware-neutral, configurable basic software for 32-bit automotive MCUs, built on Eclipse OpenBSW
copyright: Copyright 2026 Daniel Simon Reinhardt-Probul - Apache-2.0

# The pages come from the whole tree (doc/, README.md, module documents next to the code). The hook
# tools/docgen/mkdocs_hooks.py stages the published ones - open profile of tools/distcheck/distribution.yaml, never
# doc/confidential - with their repository paths into a temporary folder and makes that the docs_dir; `doc` here is
# only the starting value MkDocs checks before the hook runs.
docs_dir: doc
hooks:
  - tools/docgen/mkdocs_hooks.py

# second barrier besides the hook (patterns relative to the staged folder)
exclude_docs: |
  doc/confidential/
  doc/hardware/
  /CHANGELOG.md
  /CLAUDE.md
  platforms/stm32/
  mcudb/stm32/
  mcudb/rm4x/
  mcudb/s32k3xx/
  boards/nucleo_f446re/
  platforms/**/3rdparty/
  mcudb/*/sources/
  doc/openbsw-beitraege/*/issue.md
  bootloader/test/layouts/README.md

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: Dunkel }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: Hell }

plugins:
  - search
  # i18n scaffold DE/EN (DOC-71). Today every page exists in ONE language (most in English, new texts in German);
  # the switcher shows the same page in both trees (fallback). The translations of DOC-70 go next to the page as
  # <name>.en.md / <name>.de.md (suffix structure); the generated reference stays English in both trees (K3).
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true

extra:
  # one documentation version per release with mike (tools/requirements-site.txt); published by the manual workflow
  # .github/workflows/docs.yml (DOC-87): mike deploy --push --update-aliases <version from VERSION> latest
  version:
    provider: mike
  nextbsw:
    # Links to folders of code and to external/openbsw work on the code host but have no page in the site. Empty:
    # the site shows the link text plus the repository path. On publication: the tree URL of the tagged release,
    # e.g. https://github.com/<owner>/neXtBSW/tree/v1.0.0 (tools/docgen/site.py rewrite_links)
    source_url: ""

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  # Mermaid natively (Material renders <pre class="mermaid">); the B1 init line (%%{init: ...}%%) stays in the block
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# Navigation along the reading paths of doc/README.md (integrator, safety assessor, contributor). Only published pages
# (open profile); the test docgen-site checks that every entry is one. Entries without a label take the page title.
# Each page appears once: the integrator path ends in the safety manual, which lives under the safety assessor.
