# Kopien aus Eclipse OpenBSW in neXtBSW (TOOL-21, Vorschlag V4 in doc/architecture/openbsw-naehe.md).
# Prüfung: python -m tools.openbswsync check   Bericht: python -m tools.openbswsync report [--format markdown]
#
# Jede Wurzel ordnet ein Verzeichnis dieses Repositorys (path) einem Verzeichnis des Submoduls zu (original,
# relativ zu openbsw.path). Die Schlüssel unter files sind relativ zur Wurzel, damit ein Umzug (PLAT-54) nur path
# ändert.
#
#   status: identical  Kopie gleich dem Original (CRLF normalisiert)
#   status: modified   bewusst geändert; task (Aufgaben-ID aus doc/todo.yaml oder "Meilenstein <n>") und reason Pflicht
#   status: new        ohne Original; Schlüssel darf ein Muster sein (* ? **), task/reason freiwillig
#   upstream           Hash des Originals (SHA-256, 16 Stellen, CRLF normalisiert) beim letzten Abgleich.
#                      Ändert ein Submodul-Update das Original, wird der Test rot, bis die Änderung geprüft bzw.
#                      nachgezogen und mit "python -m tools.openbswsync accept <pfad>" eingetragen ist.
#
# Dateien mit Original, aber ohne Eintrag, sind Fehler; neue Dateien ohne Eintrag nur Warnungen (Begründung im
# Changelog TOOL-21: eine neue Datei kann nicht von OpenBSW abweichen, und parallel arbeitende Agenten legen laufend
# neue Dateien an).
