# Synthetic s32k1xx board for the hardware threshold (SYS-86): S32K144 LQFP100 with an 8 MHz crystal, a three-phase
# bridge on FTM3 (not FTM0 like the eval board), a DC link shunt amplifier whose output reaches both an ADC pin and
# the comparator input CMP0_IN3 (another pin, same node), and a bus voltage divider on a pin that is ADC channel and
# comparator input at once (PTC2 = ADC0_SE10 = CMP0_IN5). Test data only, no hardware; not the eval board's numbers.
#
# DC_LINK_I: 2 mOhm, gain 20, reference 2500 mV (half of SUPPLY_5V) -> U = 2500 mV + 40 mV/A
# BUS_VOLTAGE: divider 24k / 2k2 -> U = U_bus * 2200 / 26200
schema_version: 1

board:
  name: testboard_hw_threshold
  mcu: S32K144
  package: LQFP100
  clock: { sosc_hz: 8000000 }
  adc_reference_mv: 5000

rails:
  - { name: SUPPLY_5V, mv: 5000, source: "synthetic test rail SYS-86" }

adc:
  - name: DC_LINK_I
    instance: ADC0
    channel: SE12
    pin: PTC14
    sensor:
      kind: shunt_amplifier
      shunt_uohm: 2000
      gain: 20
      reference: { rail: SUPPLY_5V, ratio_permille: 500 }
      source: "synthetic test circuit SYS-86"
  - name: BUS_VOLTAGE
    instance: ADC0
    channel: SE10
    pin: PTC2
    scale: { divider: { r_top: 24000, r_bottom: 2200 }, offset_mv: 0 }

comparators:
  supply: { rail: SUPPLY_5V }
  inputs:
    - { name: DC_LINK_I_CMP, instance: CMP0, input: 3, pin: PTE8, signal: DC_LINK_I }
    - { name: BUS_VOLTAGE_CMP, instance: CMP0, input: 5, pin: PTC2, signal: BUS_VOLTAGE }

pwm:     # [MUX] S32K144_LQFP100.pinmux.yaml: FTM3_CH0/1 PTB8/PTB9, CH2/3 PTB10/PTB11, CH4/5 PTC10/PTC11 (MUX 2)
  - name: BRIDGE
    instance: FTM3
    mode: complementary
    active: { high_side: high, low_side: low }
    pairs:
      - { name: BRIDGE_U, high_side: BRIDGE_U_HS, low_side: BRIDGE_U_LS }
      - { name: BRIDGE_V, high_side: BRIDGE_V_HS, low_side: BRIDGE_V_LS }
      - { name: BRIDGE_W, high_side: BRIDGE_W_HS, low_side: BRIDGE_W_LS }
    channels:
      - { name: BRIDGE_U_HS, channel: 0, pin: PTB8 }
      - { name: BRIDGE_U_LS, channel: 1, pin: PTB9 }
      - { name: BRIDGE_V_HS, channel: 2, pin: PTB10 }
      - { name: BRIDGE_V_LS, channel: 3, pin: PTB11 }
      - { name: BRIDGE_W_HS, channel: 4, pin: PTC10 }
      - { name: BRIDGE_W_LS, channel: 5, pin: PTC11 }
