# Synthetic project for the SPI pin test (ARCH-38) on testboard_spi: uses GD_SPI (gate driver with its module) and
# MEM_SPI (device without a driver in this project), not SENS_SPI. Test data only, no hardware.
schema_version: 1

project:
  name: testproject_spi
  board: ../../boards/testboard_spi

clock:
  system_hz: 64000000

use:
  spi: [GD_SPI, MEM_SPI]
  dio: all

modules:
  GD: { cycle_ms: 20, console: gd1 }
