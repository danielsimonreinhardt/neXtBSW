# Synthetic project for the safe outputs table (IO-32) on testboard_safe_outputs: both gate drivers, the PWM group
# BRIDGE and the LED. Test data only, no hardware.
schema_version: 1

project:
  name: testproject_safe_outputs
  board: ../../boards/testboard_safe_outputs

clock:
  system_hz: 64000000

use:
  spi: all
  dio: all

pwm:
  BRIDGE: { frequency_hz: 16000, deadtime_ns: 500 }

modules:
  GD_A: { console: gda }
  GD_B: { console: gdb }
