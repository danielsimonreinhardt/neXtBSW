# Synthetic project for the safe outputs table in the linked image (PLAT-77) on testboard_safe_outputs_k116: the gate
# driver, the PWM group DUAL (not the board's first group HALF) and the LED. Test data only, no hardware.
schema_version: 1

project:
  name: testproject_safe_outputs_k116
  board: ../../boards/testboard_safe_outputs_k116

clock:
  system_hz: 48000000

use:
  spi: all
  dio: all

pwm:
  DUAL: { frequency_hz: 20000, deadtime_ns: 500 }

modules:
  GD_C: { console: gdc }
