# Synthetic project for the generated module binding (ARCH-52) on testboard_binding: both synthetic devices, each
# with its own console group and parameters of every type. Checked with the module directory of the test
# (tools/bswgen/test/binding/modules); without it nxconfig does not know module synthDriver. Test data only.
schema_version: 1

project:
  name: testproject_binding
  board: ../../boards/testboard_binding

clock:
  system_hz: 64000000

use:
  spi: all
  dio: all
  adc: all

modules:
  SYN_A: { cycle_ms: 20, offset_c: -5, mode: fast, console: syna }
  SYN_B: { console: synb }
