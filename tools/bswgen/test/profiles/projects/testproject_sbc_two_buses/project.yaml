# Synthetic project on testboard_sbc_errors (ARCH-41): uses both buses of SBC_B, so its one SBC has two used SPI
# buses. bsp/sbc/sbcConfiguration.h must stop the build with "the UJA113x needs exactly one SPI bus".
# Test data only, no hardware.
schema_version: 1

project:
  name: testproject_sbc_two_buses
  board: ../../boards/testboard_sbc_errors

clock:
  system_hz: 64000000

use:
  spi: [SBCB_SPI, SBCB2_SPI]
