# Synthetic project on testboard_sbc_errors (ARCH-41): uses the buses of both SBC, so the project has two UJA113x.
# bsp/sbc/sbcConfiguration.h must stop the build with "more than one UJA113x". Test data only, no hardware.
schema_version: 1

project:
  name: testproject_sbc_two
  board: ../../boards/testboard_sbc_errors

clock:
  system_hz: 64000000

use:
  spi: [SBCA_SPI, SBCB_SPI]
