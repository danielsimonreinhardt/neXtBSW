# ARCH-52: synthetic fourth device driver for the test of the generated module binding (test data only, no hardware,
# no real part). It uses every feature a bound driver can use - an SPI device, a safe_off output, a digital input the
# board may leave open, an analog input with its characteristic, parameters of every type, a console group per
# instance, an RTE reading - and it has no line in any family port: its integration is generated by tools/bswgen from
# this manifest and the trait in include/synth/SynthBinding.h (tools/bswgen/test_bswgen_binding.py).
# The module directory is only known to the test (module_dirs), never to a real project.
module: synthDriver
kind: device_driver
description: Synthetic SPI device with an enable output, an optional fault input and a sense channel (ARCH-52 test)
verification: mock
verification_note: Test data of the generated module binding (ARCH-52), compiled and run on the host only.
parts:
  - SYNTH-DRV-*
requires:
  spi_device: 1
connect:
  en:    { kind: digital_output, safe_off: true, description: "enable output, switched off by the safe state" }
  fault: { kind: digital_input, optional: true, description: "fault input; a board may leave it open" }
  sense: { kind: analog_input, description: "sense channel, converted with the characteristic of the board channel" }
parameters:
  cycle_ms: { type: int, min: 1, max: 1000, default: 10, unit: ms, description: supervision period }
  offset_c: { type: int, min: -100, max: 100, default: 0, unit: degC, description: "offset of the reading (trait: -40..40)" }
  mode:     { type: str, pattern: "slow|fast", default: slow, description: sampling mode }
  console:  { type: str, pattern: "^[a-z][a-z0-9_]{0,15}$", description: console command group of the instance }
lifecycle: { level: 1, task: bsp }
cmake_target: synthDriver           # named only: the test compiles the headers, no project links the module
console: instance
rte:
  prefix: synth
  include: synth/SynthDriver.h
  reading: ::synth::Reading
  read: readSynth
  noun: synthetic device
  values:
    value: { types: [uint16, uint32], unit: "counts" }
    qlf:   { types: [uint8], field: quality, unit: QLF_* of Rte_Qlf.h, qualifier: true }
binding:
  include: synth/SynthBinding.h
  trait: ::synth::SynthBinding
