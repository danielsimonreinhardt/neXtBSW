# Where an exported distcheck profile would be pushed (TOOL-69, customer-project.md gap N15).
#
# PLAT-114: the user created the release repositories on 2026-10-02. The open line goes to the repository below
# (private until the user releases it); the licensed and NDA lines have no repository yet and stay null, so the plan
# of `tools/ci release` marks them as undecided instead of a guessed address.
# `tools/ci release` and `tools/distcheck export` never push on their own, whatever is written here - this file
# only feeds the plan's "target" column. A push into a release repository needs the user's yes (release scope R1).

targets:
  open: https://github.com/danielsimonreinhardt/neXtBSW.git
  licensed:
  nda:

# Not a distcheck profile: the neXtBSW Studio is not part of any export (decision F12) and has a repository of its
# own. Recorded here so every release destination is in one place; no tool builds or pushes it from this file.
studio: https://github.com/danielsimonreinhardt/neXtBSW-Studio.git
