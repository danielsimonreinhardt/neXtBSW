# ------------------------------------------------------------------ Export
export:
  project: neXtBSW
  copyright: "2026 Daniel Simon Reinhardt-Probul"     # Entscheidung F13 vom 2026-09-17 (PLAT-49)
  license: Apache-2.0
  upstream: "https://github.com/eclipse-openbsw/openbsw"
  first_commit: "neXtBSW: erste Veroeffentlichung (frischer Export ohne Historie)"
  required_files: [LICENSE, NOTICE, SECURITY.md, CONTRIBUTING.md]   # NOTICE, SECURITY.md, CONTRIBUTING.md kommen aus dem Repo (DOC-01, DOC-67)
  verify_preset: buildtest-s32k148-min       # synthetisches Bau-Profil ohne eigenes Board (R9)
  generate:
    LICENSE: { template: templates/LICENSE.Apache-2.0.txt }
  # PLAT-114: Ersetzungen in sonst unveraenderten Dateien (glob, regex, with). Der Check des Quellbaums prueft R3/R7
  # auf dem ersetzten Text, meldet also nur, was im Export stehen bliebe.
  substitute:
    - glob: "doc/**/*.md"
      regex: "https?://claude\\.ai/artifact/[A-Za-z0-9_-]+"
      with: "(internal review page, not published)"
      reason: >-
        Pruefaufzeichnungen (doc/safety/reviews/records) nennen die Seite, auf der der Nutzer geurteilt hat; der Link
        bleibt im Entwicklungs-Repo als Nachweis, der offene Baum bekommt einen neutralen Text
    - glob: "tools/ci/pipeline.toml"
      regex: '\[presets\.not_built\.nucleo-f446re-demo\]\r?\nreason = "[^\r\n]*"\r?\n\r?\n'
      with: ""
      reason: >-
        TOOL-244: das Preset nucleo-f446re-demo (privates Board, F8) fehlt im Export (export.clean CMakePresets.json);
        seine Ausnahme "nicht gebaut" faellt mit weg, sonst meldet der CI-Check eine Ausnahme fuer ein unbekanntes Preset
    - glob: "tools/ci/pipeline.toml"
      regex: '\[presets\.not_built\.s32k116evb-minimal\]\r?\nreason = "[^\r\n]*"\r?\n\r?\n'
      with: ""
      reason: >-
        TOOL-243c: das Preset s32k116evb-minimal (privates Board s32k116evb, Pegel unbelegt bis PLAT-13) fehlt im Export
        (export.clean CMakePresets.json); seine Ausnahme "nicht gebaut" faellt wie bei nucleo-f446re-demo mit weg
    - glob: "tools/rtegen/test/reference/**/RteConfig.cpp"
      regex: "(\"DemoSwc\\.Run(?:10|100)ms\", &)(Run(?:10|100)ms,)"
      with: "\\1DemoSwc_\\2"
      reason: >-
        PLAT-119 (F9 A): im Export ist DemoSwc der C-Ersatz (export.overlay), seine Runnables heissen
        DemoSwc_Run10ms/DemoSwc_Run100ms (RTE-20) statt der Embedded-Coder-Namen - die Referenzausgaben von rtegen
        (rtegen-reference) folgen dem, sonst bliebe die Referenz im Export rot fuer einen Pfad, der im Profil fehlt. Ist keine Datei unter `replaces` im Profil,
  # schreibt der Export jede Quelle (rechts) an ihr Ziel (links); Quelle muss im Profil liegen, das Ziel darf keine
  # Datei des Profils sein (R13). Die Tests der Ersatz-SWC bauen den Ordner genauso (swc/DemoSwcSubstitute/test).
  overlay:
    - replaces: swc/DemoSwc/generated
      files:
        swc/DemoSwc/swc.yaml: swc/DemoSwcSubstitute/swc.yaml
        swc/DemoSwc/src/DemoSwc.c: swc/DemoSwcSubstitute/src/DemoSwc.c
      reason: >-
        Ohne das Simulink-Generat wird DemoSwc im Export eine handgeschriebene C-Komponente (swc.yaml implementation: c)
        mit derselben RTE-Schnittstelle; Modell, DemoSwc_data.m und Bau-Skripte bleiben daneben. Wer eine eigene
        MATLAB-Lizenz hat, erzeugt das Original mit swc_build und entfernt swc.yaml und src/ (swc/DemoSwcSubstitute/README.md)
  # DOC-85: Liste dessen, was der Export absichtlich weglaesst (tools/distcheck/unpublished.py). Die Konsistenztests
  # (doc/safety/test) nehmen eine fehlende Quelle - Datei, Testeintrag, Aufgabe - im Export nur hin, wenn sie dort
  # steht; eine fehlende oeffentliche Datei bleibt ein Fehler. Dateien nur aus dem Rahmen `files` und nur Klasse
  # private (NDA- und Arbeitsplatzmaterial wird nicht einmal beim Namen genannt); `folders` werden als Ganzes genannt
  # (Board-Mitschnitte, Studio, interne Planung - vom Safety Case zitiert; jede Datei darin muss privat sein);
  # `cleaned`: die bereinigt geschriebenen Dateien (Textstellen des Originals fehlen dort absichtlich); Tests und
  # Aufgaben: was die Bereinigung von tests.yaml und todo.yaml entfernt (die Testnamen stehen dort ohnehin als Kommentar)
  unpublished:
    file: doc/unpublished.yaml
    files: ["doc/safety/**", "doc/requirements/**"]
    folders: [tools/boardtest/captures, tools/studio, tools/todo]
    tests: tools/test/tests.yaml
    tasks: doc/todo.yaml
  clean:
    - file: CHANGELOG.md
      mode: replace
      template: templates/CHANGELOG.public.md
    - file: CLAUDE.md
      mode: sections
      note: |
        <!-- Bereinigte Fassung: die Abschnitte zur internen Arbeitsweise (Agenten, Koordinator, eigenes Board,
             Hardware-Freigaben) sind entfernt. -->
      drop_bullets:                            # ganzer Aufzaehlungspunkt, wenn eine seiner Zeilen passt
        - "ai/artifact"
        - "Entscheidungsboard"
        - "neXtBSW Studio"
        - "Nur committen"
        - "evalboard_s32k144|Eval Board S32K144"
        - "Lizenz und Veröffentlichung"
      drop_headings:
        - "Sicherheitsregeln Hardware"
        - "Parallele Arbeit mit Agenten"
        - "Ablauf fuer den Koordinator"
        - "Ablauf für den Koordinator"
        - "Regeln fuer Agenten"
        - "Regeln für Agenten"
      drop_lines:
        - "claude\\.ai/artifact"
        - "github\\.com/danielsimonreinhardt"
        - "[A-Za-z]:[\\\\/](WORK|DATA|TOOLS|NXP|Users)[\\\\/]"
        - "COM9|CANcaseXL|J-Link|JP1|MTPNV"
        - "Entscheidungsboard"
        - "evalboard_s32k144|evalboard-s32k144"
        - "auf diesem PC"
    - file: doc/todo.yaml
      mode: todo
      profile: open
      keep_fields: [id, area, prio, status, title, depends]   # done_when enthaelt interne Notizen
      drop_status: [done]
      drop_tasks_matching:
        - "NDA"
        - "vertraulich|confidential"
        - "evalboard_s32k144"
        - "doc/confidential"
        - "tools/studio"
        - "claude\\.ai/artifact"
      note: |
        # Oeffentliche Fassung der Aufgabenliste (erzeugt von tools/distcheck).
        # Interne Felder (owner, touches, shared, needs, verify, done_when) und Aufgaben, die private Pfade
        # beruehren oder nicht weitergebbare Unterlagen nennen, sind entfernt.
    - file: tools/test/tests.yaml
      mode: tests_yaml
      drop_matching:                           # Target-Eintraege mit Presets privater Projekte
        - "evalboard-s32k144"
      # DOC-73 (K1): Eintraege, die nicht exportierte Dateien lesen, ohne sie in args/covers zu nennen
      reads:
        safety-plan: [doc/safety/iso26262-gap.md, doc/safety/reviews/records]   # Lueckenzeilen 2.1-2.4, Urteile CM-nn
        safety-dfa: [doc/requirements/safety/mechanisms.sdoc]   # liest den Katalog ohne requires-Probe (PLAT-62)
        # PLAT-119: erwartet im ELF die Embedded-Coder-Runnables der DemoSwc und ihre -Werror-Ausnahme
        target-c-swc: [swc/DemoSwc/generated/src/DemoSwc.c]
        # TOOL-244: laedt Bootloader und Derivat der privaten Familie stm32 (Klasse Stm32ImagesTest)
        elfcheck-stm32: [mcudb/stm32/STM32F446RE.yaml]
        # TOOL-243c: bauen das Projekt des privaten Boards s32k116evb (Preset s32k116evb-minimal, bis PLAT-13);
        # s32k116-images nennt das Projekt in args und geht von selbst
        target-buildtest-s32k116: [projects/s32k116evb_minimal/project.yaml]
        elfcheck-s32k116: [projects/s32k116evb_minimal/project.yaml]
      narrow:
        # TaskFloorTest.test_demo_profile_and_report liest den Stack-Bericht des privaten Demo-Projekts; die uebrigen
        # acht Faelle der Klasse laufen weiter (unittest -k mit fnmatch-Muster)
        - test: stackuse
          reads: tools/stackuse/reports/evalboard_s32k144_demo.md
          replace: "-k, TaskFloorTest]"
          with: "-k, \"*TaskFloorTest.test_[!d]*\"]"
        # PLAT-119 (F9 A): ohne das Simulink-Generat (DemoSwc als C-Ersatz, TypeSwc fehlt) laufen die Faelle nicht, die
        # den erzeugten Code uebersetzen oder das ARXML/die Embedded-Coder-Namen erwarten; der Rest der Eintraege bleibt.
        # pytest statt unittest, weil nur pytest -k Faelle abwaehlen kann (gefunden im Probe-Export 2026-10-06)
        - test: rtegen
          reads: swc/DemoSwc/generated/src/DemoSwc.c
          replace: "kind: unittest"
          with: "kind: pytest"
        - test: rtegen
          reads: swc/DemoSwc/generated/src/DemoSwc.c
          replace: "args: [tools/rtegen/test_rtegen.py]"
          with: 'args: [tools/rtegen/test_rtegen.py, -q, -k, "not (RteTypes or RteCaptureHostTest or RtePwmHostTest or RteCanHostTest or RteCommControlHostTest or RteQualifierHostTest or RteEventHostTest or RteEcuStateHostTest or test_demo_component_is_parsed or test_demo_project_keeps_ecu_description_and_dbc or test_generation_output or test_pair_driven_by_two_ports or test_access_points_are_parsed or test_sizes_of_the_copies or test_demo_component_reads_its_data_file or test_qualifier_ports or test_validate_matches_generate)"]'
        - test: rtegen
          reads: tools/rtegen/test/types/rte_types_host_test.cpp
          replace: "- tools/rtegen/test/types/rte_types_host_test.cpp"
          with: "# (privat, PLAT-119)"
        - test: rtegen-c-swc
          reads: swc/DemoSwc/generated/src/DemoSwc.c
          replace: "kind: unittest"
          with: "kind: pytest"
        - test: rtegen-c-swc
          reads: swc/DemoSwc/generated/src/DemoSwc.c
          replace: "args: [tools/rtegen/test_rtegen_c_swc.py]"
          with: 'args: [tools/rtegen/test_rtegen_c_swc.py, -q, -k, "not (DescriptionFindingsTest or CSwcHostTest or test_rte_components_cmake or test_simulink_component_with_swc_yaml_stays_on_the_arxml or test_simulink_component_dimensions_against_the_arxml)"]'
        - test: rtegen-device-values
          reads: swc/DemoSwc/generated/src/DemoSwc.c
          replace: "kind: unittest"
          with: "kind: pytest"
        - test: rtegen-device-values
          reads: swc/DemoSwc/generated/src/DemoSwc.c
          replace: "args: [tools/rtegen/test_rtegen_device_values.py]"
          with: 'args: [tools/rtegen/test_rtegen_device_values.py, -q, -k, "not DeviceValueHostTest"]'
        - test: rtegen-disabled
          reads: swc/DemoSwc/generated/src/DemoSwc.c
          replace: "kind: unittest"
          with: "kind: pytest"
        - test: rtegen-disabled
