# Klassifizierung jeder Datei des Repositoriums fuer den Export (PLAT-50).
# Konzept: doc/architecture/lizenz-und-release.md Abschnitt 5.2/5.3. Entscheidungen des Nutzers vom 2026-09-17
# (Entscheidungsboard, PLAT-46): Apache-2.0 ueberall, DCO fuer Beitraege, erste Veroeffentlichung als frischer
# Export ohne Historie (F5), Eval-Board- und Schaltplanmaterial sowie Hersteller-PDFs bleiben privat (F6/F10),
# mcudb-Werte nur mit oeffentlichem Beleg (F8), CHANGELOG/todo/CLAUDE.md bereinigt veroeffentlichen (F11),
# das Desktop-Studio wird nicht an Dritte ausgeliefert (F12).
#
# Klassen: open < licensed < nda < private < workstation. Eine Datei darf in ein Profil, wenn ihre Klasse nicht
# hoeher ist als das Profil. Wer nichts trifft, ist "nicht klassifiziert" und damit im Export verboten.
# Der spezifischste Glob gewinnt (Zahl der /-Ebenen, dann Laenge des festen Anfangs, dann spaetere Zeile);
# ein Modul-Manifest mit `distribution:` schlaegt diese Tabelle.
#
# Felder je Eintrag: glob, class, license (SPDX fuer Dateien ohne eigenen Kopf), reason, verify (Klasse noch
# nicht belegt -> Warnung), binary_ok (Binaer-/Dokumentdatei ist gewollt), cleaned (wird nur bereinigt
# veroeffentlicht, siehe export.clean), allow (Muster-IDs, die hier geduldet sind, mit Begruendung im reason).
#
# Diese Tabelle gehoert laut Konzept spaeter in die Repo-Wurzel (distribution.yaml). Sie liegt hier, weil PLAT-50
# nur unterhalb von tools/distcheck schreiben darf; --rules zeigt auf einen beliebigen Pfad.

version: 1

pattern_file: doc/confidential/distcheck-patterns.yaml   # private Musterliste (NDA-Texte), .gitignore-Ordner

profiles:
  open:
    licenses: [Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, CC-BY-4.0, CC0-1.0, OFL-1.1,
               AdditionRef-neXtBSW-Generator-Output-Exception]
  licensed:
    licenses: [Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, CC-BY-4.0, CC0-1.0, OFL-1.1,
               LicenseRef-neXtBSW-Commercial, AdditionRef-neXtBSW-Generator-Output-Exception]
  nda:
    licenses: [Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, CC-BY-4.0, CC0-1.0, OFL-1.1,
               LicenseRef-neXtBSW-Commercial, LicenseRef-neXtBSW-NDA,
               AdditionRef-neXtBSW-Generator-Output-Exception]

suffixes:
  # Dateien, die einen SPDX-Kopf tragen sollen (R2)
  source: [.c, .cpp, .cc, .h, .hpp, .inc, .py, .cmake, .m, .s, .j2, .ld, .dld, .in]
  # Binaer- und Dokumentdateien, die im Profil einen ausdruecklichen Eintrag brauchen (R4)
  binary: [.pdf, .svd, .pack, .lib, .a, .zip, .slx, .ttf, .asc, .hex, .bin, .elf, .png, .jpg, .exe, .dll]
  # nicht zeilenweise durchsuchbar
  no_text_scan: [.pdf, .slx, .ttf, .zip, .lib, .a, .bin, .hex, .elf, .png, .jpg, .exe, .dll, .svd, .pack]

# ------------------------------------------------------------------ R3: oeffentliche Grundliste der Textmuster
# Die Liste, die NDA-Dokumente beim Namen nennt, liegt NICHT hier, sondern unter pattern_file.
content_patterns:
  # der Ordnername doc/confidential (lokal, .gitignore) ist kein Aufdruck
  - { id: confidential, regex: "(?<!doc/)\\bconfidential\\b(?!/)", text: "Vertraulichkeitsaufdruck" }
  - { id: nda, regex: "\\b(under (an )?NDA|non-disclosure agreement|NDA-Unterlage|Geheimhaltungs)", text: "NDA-Bezug" }
  - { id: la_opt_nxp, regex: "LA_OPT_NXP", text: "NXP-Zusatzlizenz (Weitergabe nur mit Zusatzvereinbarung)" }
  - { id: proprietary, regex: "proprietary (and|information)", text: "Proprietaeraufdruck" }
  - { id: do_not_distribute, regex: "(do not distribute|internal use only|nicht zur Weitergabe)", text: "Weitergabeverbot" }
  # PLAT-119 (F9 A): Kopfzeilen, die Simulink Coder/Embedded Coder in C-Code und ARXML schreibt - erzeugt unter einer
  # MATLAB-Studentenlizenz, darf nicht in einen Export (auch nicht als Kopie in einem Testprofil)
  # TOOL-240: AH1506/AH1507 sind nicht oeffentlich; der Name allein ist erlaubt, Inhalte daraus (Tabelle, Kapitel,
  # Abbildung, Abschnitt) nicht - Wortlaut in tools/distcheck/patterns.example.yaml (app_hint_content)
  - id: app_hint_content
    regex: '\bAH15(?:06|07)\b[\s,:;(]*(?:Rev\.?\s*\d+(?:\.\d+)*[\s,:;(]*)?(?:(?:tabelle|table|tab\.|kapitel|chapter|section|abschnitt|abbildung|abb\.|figure|fig\.|§)|\d+\.\d)|\b(?:tabelle|table|tab\.|kapitel|chapter|section|abschnitt|abbildung|abb\.|figure|fig\.|§)\s*[A-Za-z0-9.-]{1,10}\s+(?:of|in|from|aus|von|in der|in dem)\s+AH15(?:06|07)\b'
    text: "Inhalt aus AH1506/AH1507 (nicht oeffentlich, nur der Name ist erlaubt)"
  - { id: simulink_generated,
      regex: "(Code generated for Simulink model|Simulink Coder version\\s*:|Embedded Coder version\\s*:|Auto generated XML Component Description for model)",
      text: "mit MATLAB/Simulink (Studentenlizenz) erzeugter Code oder ARXML (F9 A, PLAT-119)" }

# ------------------------------------------------------------------ R7: Geheimnisse und Arbeitsplatzspuren
secrets:
  - { id: bl_security_constant, regex: "BL_SECURITY_CONSTANT\\s*[=(:]?\\s*0x[0-9A-Fa-f]{4,}",
      text: "Schluessel des Bootloader-Security-Access" }
  - { id: private_key, regex: "-----BEGIN [A-Z ]*PRIVATE KEY-----", text: "privates Schluesselmaterial" }
  - { id: token, regex: "(gh[pousr]_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})",
      text: "Zugangstoken" }
  # PLAT-114: seit 2026-10-02 ist neXtBSW_development das private Entwicklungs-Repo und neXtBSW-Studio das des
  # Studios; das offene Repo neXtBSW und der oeffentliche OpenBSW-Fork des Kontos duerfen genannt werden
  - { id: private_repo, regex: "github\\.com/danielsimonreinhardt/(neXtBSW_development|neXtBSW-Studio)\\b",
      text: "Adresse eines privaten Repositoriums (Entwicklung, Studio)" }
  - { id: decision_board, regex: "claude\\.ai/artifact/", text: "internes Entscheidungsboard" }
  - { id: workstation_path, regex: "[A-Za-z]:[\\\\/](WORK|DATA|TOOLS|NXP|Users)[\\\\/]",
      text: "Pfad des Arbeitsplatzes", severity: warning }

# ------------------------------------------------------------------ R11: Belege der Derivatdatenbank
evidence:
  # TOOL-241 (F8): auch die freigegebenen Boards (boards/*/board.yaml, nur im Profil, soweit nicht private)
  files: ["mcudb/**/*.yaml", "boards/**/board.yaml"]
  # Werte mit `verify: true` haben keinen oeffentlichen Beleg: Befund (Fehler) -> der Export bricht ab und nennt die
  # Liste. Kein Platzhalter, weil der Baum baubar bleiben muss (Generatoren brauchen die Werte). Freigabe je Datei
  # per Entscheidung des Nutzers: accepted: [{ glob: "mcudb/stm32/STM32G474RE.yaml", reason: "..." }]
  unverified:
    severity: error
    accepted: []
  forbidden_sources:
    - { id: s32ds, regex: "\\[S32DS\\]", text: "Wert aus S32DS-Geraetedateien (NXP Confidential) statt aus RM/Datenblatt" }
    - { id: confidential_source, regex: "confidential", text: "Beleg nennt eine vertrauliche Quelle" }
    - { id: nda_source, regex: '\bNDA\b|AH15(06|07)', text: "Beleg nennt eine NDA-Unterlage (NDA, AH1506/AH1507)" }

# ------------------------------------------------------------------ R6: Fremdquellen
integrity:
  - { dir: platforms/common/3rdparty/cmsis, requires: [README.md] }
  - { dir: platforms/s32k1xx/3rdparty/freertos_cm0_sysTick, requires: [README.md] }
  - { dir: mcudb/s32k1xx/sources/hal_nxp, requires: [README.md] }
  - { dir: mcudb/stm32/sources/stm32_open_pin_data, requires: [README.md] }

# ------------------------------------------------------------------ R5: Ziele aus Eclipse OpenBSW
# TOOL-244: Ziele, die im echten Bau aus external/openbsw (oder der Familienplattform dort) kommen. Die Bautests der
# privaten Familien (platforms/stm32/test/buildtest) definieren sie nur als Platzhalter; der Referenzcheck darf sie
# deshalb nicht als "in einer nicht exportierten Datei definiert" melden.
# Dazu die Ziele des privaten FreeRTOS-Ports von rm4x: freertosPort waehlt ihn nur fuer armv7r und bricht mit Meldung
# ab, wenn der Ordner fehlt (EXISTS-Pruefung); der Test des Kerns liest INTERFACE_LINK_LIBRARIES, daher kein
# $<TARGET_NAME_IF_EXISTS:...> dort.
external_targets: [etl, util, bsp, common, cpp2can, socBsp, freeRtosCrxPort, freeRtosCrx]

# ------------------------------------------------------------------ Klassifizierung
paths:

  # --- Grundregel: alles, was nicht ausdruecklich geoeffnet ist, bleibt privat -----------------------------
  - glob: "**"
    class: private
    reason: "Voreinstellung: nicht ausdruecklich klassifiziert = nicht veroeffentlichen"

  # --- Firmware, Bibliotheken, Plattformen ---------------------------------------------------------------
  - { glob: "libs/**", class: open, license: Apache-2.0, reason: "Eigenentwicklung und OpenBSW-Ableitungen" }
  - { glob: "platforms/**", class: open, license: Apache-2.0, reason: "Plattformcode je Familie" }
  # TOOL-244 (Nutzer 2026-10-07): der oeffentliche Stand umfasst vorerst nur S32K1; STM32 und RM4x samt Fremdquellen
  # (ST cmsis_device_f4, FreeRTOS ARM_CRx) und Tests bleiben privat. Die Host-Tests, die sie lesen, nimmt
  # export.clean (tests_yaml) aus dem Export.
  - { glob: "platforms/stm32/**", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "platforms/rm4x/**", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "bootloader/platforms/stm32/**", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "ecu/platforms/stm32/**", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "ecu/platforms/nucleo_f446re/**", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "platforms/common/test/cortexr4f/**", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "platforms/common/test/test_cortex_r4f.py", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "bootloader/test/board/stm32f446/**", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "bootloader/test/test_bl_stm32_build.py", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "tools/bswgen/test_blgen_stm32.py", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "mcudb/tools/pinmux_stm32_open_pin_data.py", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "mcudb/tools/pinout_stm32_open_pin_data.py", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "mcudb/tools/test_pinmux_stm32_open_pin_data.py", class: private, reason: "Familie noch nicht unterstuetzt, Chipdaten nicht oeffentlich belegt (F8, TOOL-243/244)" }
  - { glob: "ecu/**", class: open, license: Apache-2.0, reason: "aus der OpenBSW-Referenz-App abgeleitet" }
  - { glob: "ecu/platforms/evalboard_s32k144/**", class: private,
      reason: "Board-Port des eigenen Eval Boards (F10; Safety-Review 2026-10-02 F2 a, PLAT-62)" }
  - { glob: "ecu/platforms/s32k116evb/**", class: private,
      reason: "Board-Port des privaten Boards s32k116evb (Pegel nicht oeffentlich belegt) - privat bis PLAT-13 (TOOL-243c)" }
  - { glob: "bootloader/**", class: open, license: Apache-2.0, reason: "eigener UDS-Bootloader" }
  - { glob: "cmake/**", class: open, license: Apache-2.0 }
  - { glob: "CMakeLists.txt", class: open, license: Apache-2.0 }
  - { glob: "VERSION", class: open, license: Apache-2.0,
      reason: "Version der neXtBSW (ARCH-55), einzige Quelle fuer CMake, Werkzeuge und den Pin eines Kunden-Repos" }
  - { glob: "CMakePresets.json", class: open, license: Apache-2.0, cleaned: true,
      reason: "Profile der privaten Projekte werden beim Export entfernt (export.clean)" }
  - { glob: ".gitattributes", class: open, license: Apache-2.0 }
  - { glob: "**/.gitattributes", class: open, license: Apache-2.0 }
  - { glob: ".gitignore", class: open, license: Apache-2.0, allow: [nda],
      reason: "haelt den lokalen NDA-Ordner aus jedem Checkout heraus - gerade im offenen Baum noetig" }
  - { glob: ".gitmodules", class: open, license: Apache-2.0, reason: "Verweis auf Eclipse OpenBSW (oeffentlich)" }
  - { glob: "README.md", class: open, license: Apache-2.0 }
  - { glob: ".github/**", class: open, license: Apache-2.0, reason: "CI-Beschreibung" }
  - { glob: ".github/workflows/docs.yml", class: open, license: Apache-2.0,
      reason: "Veroeffentlichung der Doku-Website mit mike nach gh-pages (DOC-87); laeuft im Release-Repository" }
  - { glob: "SECURITY.md", class: open, license: Apache-2.0,
      reason: "Meldeweg fuer Schwachstellen (GitHub Private Vulnerability Reporting), unterstuetzte Versionen (DOC-67)" }
  - { glob: "CONTRIBUTING.md", class: open, license: Apache-2.0, allow: [nda],
      reason: "Beitragsregeln mit DCO (DOC-01); nennt NDA-Material nur als Ausschlussregel" }
  - { glob: "external/openbsw", class: open, license: Apache-2.0,
      reason: "Submodul-Verweis (Gitlink); der Inhalt kommt von Eclipse OpenBSW und wird nicht mitexportiert" }

  # --- aus NDA-Unterlagen abgeleitet (IO-06, Datenblatt nur unter NDA erhalten) ------------------------
  # Seit dem Merge von IO-06 liegt der Treiber in dev. Er darf nicht in den offenen Zweig (CLAUDE.md, F3 offen).
  - { glob: "libs/bsw/bccMc33771/**", class: nda, license: LicenseRef-neXtBSW-NDA,
      reason: "Registerdaten aus NDA-Unterlagen (IO-06)" }
  - { glob: "platforms/s32k1xx/port/bspConfiguration/include/bsp/bcc/**", class: nda,
      license: LicenseRef-neXtBSW-NDA, reason: "Konfiguration des NDA-Treibers (IO-06)" }
  - { glob: "platforms/s32k1xx/port/main/include/systems/CellMonitorSystem.h", class: nda,
      license: LicenseRef-neXtBSW-NDA, reason: "System des NDA-Treibers (IO-06)" }
  - { glob: "platforms/s32k1xx/port/main/src/systems/CellMonitorSystem.cpp", class: nda,
      license: LicenseRef-neXtBSW-NDA, reason: "System des NDA-Treibers (IO-06)" }

  # --- Fremdquellen im Baum ------------------------------------------------------------------------------
  - { glob: "platforms/common/3rdparty/cmsis/**", class: open, license: Apache-2.0, reason: "ARM CMSIS_6" }
  - { glob: "platforms/s32k1xx/3rdparty/freertos_cm0_sysTick/**", class: open, license: MIT,
      reason: "FreeRTOS-Kernel V10.6.2 (Amazon)" }
  - { glob: "platforms/s32k1xx/bsp/bspMcu/include/3rdparty/nxp/**", class: open, license: BSD-3-Clause,
      reason: "NXP-Derivat-Header (Zephyr hal_nxp, RTD)" }

  # --- Derivatdatenbank ----------------------------------------------------------------------------------
  - { glob: "mcudb/**", class: open, license: Apache-2.0, reason: "eigene Datensammlung, Belege je Wert (R11)" }
  - { glob: "mcudb/s32k1xx/sources/hal_nxp/**", class: open, license: Apache-2.0, reason: "Zephyr hal_nxp (NXP)" }
  # TOOL-243 (F8 b, Nutzer 2026-10-07): noch nicht unterstuetzte Ziele bleiben vorerst privat - ihre Werte sind nicht
  # oeffentlich belegt (R11), bis zur Unterstuetzung privat. Die Fremdquellen darunter gehen mit (der spezifischere
  # Glob gewinnt, ein offener Unterordner bliebe sonst ohne seine Derivatdatei im Export).
  - { glob: "mcudb/stm32/**", class: private,
      reason: "noch nicht unterstuetzt, Werte nicht oeffentlich belegt (F8), bis zur Unterstuetzung privat (TOOL-243)" }
  - { glob: "mcudb/s32k3xx/**", class: private,
      reason: "noch nicht unterstuetzt, Werte nicht oeffentlich belegt (F8), bis zur Unterstuetzung privat (TOOL-243)" }
  - { glob: "mcudb/rm4x/**", class: private,
      reason: "noch nicht unterstuetzt, Werte nicht oeffentlich belegt (F8), bis zur Unterstuetzung privat (TOOL-243)" }
  - { glob: "mcudb/s32k3xx/sources/hal_nxp/**", class: private,
      reason: "Zephyr hal_nxp (NXP, Apache-2.0) - mit mcudb/s32k3xx privat: noch nicht unterstuetzt (F8, TOOL-243)" }
  # Testdaten und Tests, die die privaten Derivate beim Namen laden (R5-Fehler, TOOL-243): gehen mit ihnen. Die
  # Host-Tests, die sie implizit lesen (stm32-/rm4x-Klassen in tools/canflash, tools/nxconfig, tools/elfcheck,
  # platforms/stm32/test), laufen im Export nicht - Folgeaufgabe, siehe Changelog-Fragment TOOL-243
  - { glob: "bootloader/test/layouts/stm32f446_unequal.yaml", class: private,
      reason: "synthetisches Bootloader-Layout fuer STM32F446RE/nucleo_f446re, liest die uid aus mcudb/stm32 (F8, TOOL-243)" }
  - { glob: "tools/nxconfig/test/profiles/boards/testboard_rm46/**", class: private,
      reason: "Test-Board mit mcu: RM46L852 (mcudb/rm4x privat, F8, TOOL-243)" }
  - { glob: "tools/nxconfig/test/profiles/projects/testproject_rm46/**", class: private,
      reason: "Test-Projekt auf testboard_rm46 (mcudb/rm4x privat, F8, TOOL-243)" }
  - { glob: "mcudb/tools/test_pinout.py", class: private,
      reason: "familienuebergreifender Pinout-Test, importiert mcudb/rm4x/tools und prueft stm32-/rm4x-/s32k3-Tabellen (F8, TOOL-243)" }
  - { glob: "mcudb/tools/test_rtd_adapter.py", class: open, license: Apache-2.0, allow: [confidential],
      reason: "Test prueft, dass die uebernommenen BSD-3-Herstellerdateien KEINEN Vertraulichkeitsaufdruck tragen; PLAT-114" }
  - { glob: "mcudb/stm32/sources/stm32_open_pin_data/**", class: private,
      reason: "ST STM32_open_pin_data (BSD-3-Clause; F7 noch offen) - mit mcudb/stm32 privat: noch nicht unterstuetzt (F8, TOOL-243)" }
  - { glob: "mcudb/s32k1xx/sources/keil_s32k116_dfp/**", class: open, license: Apache-2.0, allow: [la_opt_nxp],
      reason: "nur Anleitung; der Text zitiert LA_OPT_NXP als Begruendung, warum die SVD NICHT im Repo liegt" }

  # --- Werkzeuge -----------------------------------------------------------------------------------------
  - { glob: "tools/**", class: open, license: Apache-2.0, reason: "Kernbibliotheken und Generatoren" }
  - { glob: "tools/studio/**", class: private,
      reason: "neXtBSW Studio wird nicht an Dritte ausgeliefert (Entscheidung F12 vom 2026-09-17)" }
  - { glob: "tools/todo/**", class: private, reason: "interne Planung und Agenten-Workflow (F11)" }
  - { glob: "tools/boardtest/suites/evalboard_s32k144_*.yaml", class: private,
      reason: "Board-Testplan des eigenen Eval Boards (F10; PLAT-62), gehoert zu den privaten Mitschnitten" }
  - { glob: "tools/boardtest/captures/**", class: private,
      reason: "Messmitschnitte des eigenen Boards (Eval-Board-Material bleibt privat)" }
  - { glob: "tools/stackuse/reports/evalboard_s32k144_*", class: private,
      reason: "Stack-Bericht des privaten Demo-Projekts (K1, DOC-73); Berichte offener Projekte bleiben offen" }
  - { glob: "tools/distcheck/**", class: open, license: Apache-2.0,
      allow: [confidential, nda, la_opt_nxp, proprietary, do_not_distribute, simulink_generated, private_repo,
              decision_board, workstation_path, bl_security_constant, private_key, token, private_dir_names],
      reason: "das Pruefwerkzeug selbst enthaelt die Muster, nach denen es sucht" }
  - { glob: "tools/requirements.txt", class: open, license: Apache-2.0 }
  - { glob: "tools/docgen/test_mermaid.py", class: open, license: Apache-2.0, allow: [confidential],
      reason: "Test schliesst den Ordner mit lizenzierten Normen beim Einsammeln der Markdown-Dateien aus (liest ihn nie); DOC-63" }
  - { glob: "tools/rtegen/test/types/**/*.slx", class: open, license: Apache-2.0, binary_ok: true,
      reason: "eigenes Simulink-Testmodell der Typ-Pruefung von rtegen (TypeSwc), wie swc/**/*.slx (F9 A: Modell bleibt offen); PLAT-114" }
  # PLAT-119 (Entscheidung F9 A vom 2026-10-06): Code und ARXML, die Simulink Coder/Embedded Coder R2024a unter einer
  # MATLAB-Studentenlizenz erzeugt hat, gehen nicht in den Export (Apache-2.0 erlaubt kommerzielle Nutzung, die
  # Studentenlizenz nicht). Modelle, Parameter und Bau-Skripte bleiben offen; R3-Muster simulink_generated haelt
  # weiteres Generat auf.
  - { glob: "tools/rtegen/test/types/TypeSwc/generated/**", class: private,
      reason: "Simulink-Coder-Generat (C und ARXML) des Testmodells TypeSwc, MATLAB-Studentenlizenz (F9 A, PLAT-119)" }
  - { glob: "tools/rtegen/test/types/TypeSink/generated/arxml/TypeSink_datatype.arxml", class: private,
      reason: "Kopie des Simulink-Coder-ARXML TypeSwc_datatype.arxml, MATLAB-Studentenlizenz (F9 A, PLAT-119)" }
  # Host-Tests, die den erzeugten Kopf TypeSwc.h einbinden (R5): ohne das Generat nicht uebersetzbar
  - { glob: "tools/rtegen/test/types/rte_types_host_test.cpp", class: private,
      reason: "bindet TypeSwc.h des privaten Simulink-Generats ein (F9 A, PLAT-119)" }
  - { glob: "tools/rtegen/test/nvm/rte_nvm_host_test.cpp", class: private,
      reason: "bindet TypeSwc.h des privaten Simulink-Generats ein (F9 A, PLAT-119)" }
  - { glob: "tools/rtegen/test/nvm/rte_nvm_asil_host_test.cpp", class: private,
      reason: "bindet TypeSwc.h des privaten Simulink-Generats ein (F9 A, PLAT-119)" }
  # PLAT-114: der Studio-Ablauf (Import, Ins Modell schreiben, Aus Modell uebernehmen) gehoert zum Studio, das nicht
  # ausgeliefert wird (F12): studio_flow.py ruft studio.core auf, die MATLAB-Tests, die es aufrufen, gehen mit.
