    # PLAT-114: Annotationen ohne exportierte Datei (NDA-Modul, Studio, Hersteller-PDFs) fallen weg, damit der offene
    # Baum nur Lizenzen nennt, deren Text er unter LICENSES/ mitbringt
    - file: REUSE.toml
      mode: reuse_toml
      profile: open
    - file: CMakePresets.json
      mode: json_drop
      arrays: [configurePresets, buildPresets, testPresets]
      drop_matching:
        - "projects/evalboard_s32k144"
        - "\"name\": \"evalboard-s32k144"
        # TOOL-243: Projekt des privaten Boards nucleo_f446re (F8)
        - "projects/nucleo_f446re_demo"
        - "\"nucleo-f446re-demo\""
        # TOOL-243c: Projekt des privaten Boards s32k116evb (Pegel unbelegt, bis PLAT-13); dazu das Worktree-Preset
        - "projects/s32k116evb_minimal"
        - "\"s32k116evb-minimal"
