# SPDX-License-Identifier: Apache-2.0
# Synthetic project for the sensor characteristics (IO-18) on testboard_sensors: the loads of two pull-up channels
# (an NTC after the beta model and a table) and the parameters of the high-side switch. Test data only - the NTC is
# no real part (the eval board motor NTC has no data yet, decision of the user 2026-09-16).
schema_version: 1

project:
  name: testproject_sensors
  board: ../../boards/testboard_sensors

clock:
  system_hz: 48000000

use:
  adc: all
  dio: all

adc_loads:
  TEMP_NTC:
    kind: ntc_beta
    r_nominal_ohm: 10000
    beta_k: 3950
    t_min_ddegc: -400
    t_max_ddegc: 1250
    step_ddegc: 50
    max_error_ddegc: 10
    source: "synthetic test NTC IO-18"
  LEVEL:
    kind: table
    unit: permille
    points: [[0, 0], [200, 400], [600, 900], [1000, 1000]]
    source: "synthetic test table IO-18"

modules:
  PUMP_SW:
    overcurrent_ma: 2500
    overcurrent_debounce_ms: 20
    fault_ma: 3200
    fault_debounce_ms: 10
    switch_on_blanking_ms: 20
    open_load_ma: 10
    off_max_ma: 300
    off_debounce_ms: 50
    console: pump
