# Synthetic project for the generated digital input configuration (ARCH-13) on testboard_s32k_8mhz: the project uses
# only the output LED and no digital input, no CAN, no PWM. Test data only.
schema_version: 1

project:
  name: testproject_s32k_no_inputs
  board: ../../boards/testboard_s32k_8mhz

clock:
  system_hz: 64000000

use:
  uart: all
  dio: [LED]

uart:
  CONSOLE: { baudrate: 115200 }
