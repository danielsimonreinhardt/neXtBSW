# Synthetic s32k1xx board for the PCC clock tests (PLAT-22) with the test derivative TESTK1X, whose peripheral
# instances differ from the S32K144 of the eval board: PWM on FTM6 (an instance the OpenBSW clock driver does not
# switch on), I2C on LPI2C1 (bus clock), console on LPUART1, one CAN bus, an input capture on FTM7 (the instance
# without a functional clock in the database - the project only uses it in the error test). Test data only.
schema_version: 1

board:
  name: testboard_s32k1_gates
  mcu: TESTK1X
  package: LQFP64
  clock: { sosc_hz: 8000000 }

devices:
  - { name: PHY, part: TJA1051 }

can:
  - { name: VEH, instance: FlexCAN0, rx: { pin: PTE4 }, tx: { pin: PTE5 }, phy: PHY }

uart:
  - { name: CONSOLE, instance: LPUART1, rx: { pin: PTC8 }, tx: { pin: PTC9 } }

# LPI2C1 is a real I2C instance: no flexio_pin (TOOL-120 - only a FlexIO instance has data pins)
i2c:
  - { name: SENSOR, instance: LPI2C1, sda: { pin: PTA2 }, scl: { pin: PTA3 } }

pwm:
  - name: FAN
    instance: FTM6
    mode: complementary
    active: { high_side: high, low_side: high }
    pairs:
      - { name: FAN_A, high_side: FAN_A_HS, low_side: FAN_A_LS }
    channels:
      - { name: FAN_A_HS, channel: 0, pin: PTB2 }
      - { name: FAN_A_LS, channel: 1, pin: PTB3 }
    # IO-24: synthetic fast power stage, no component. Minimum dead time: switch max(0, (30 + 10) - 8) = 32 ns
    # (off path not shortened by the smaller turn-off resistor) + driver 55 - 40 = 15 ns + project margin
    power_stage:
      switch: { turn_on_delay_ns: 8, rise_time_ns: 12, turn_off_delay_ns: 30, fall_time_ns: 10,
                test_gate_resistance_mohm: 4700, internal_gate_resistance_mohm: 1000, gate_charge_nc: 30,
                r_ds_on_mohm: 5, r_ds_on_hot_mohm: 8, source: "synthetic test stage IO-24" }
      driver: { turn_on_delay_ns: 40, turn_off_delay_ns: 55, source: "synthetic test stage IO-24" }
      gate: { turn_on_resistance_mohm: 4700, turn_off_resistance_mohm: 2200, source: "synthetic test stage IO-24" }
      short_circuit: { vds_threshold_mv: 500, blanking_ns: 200, source: "synthetic test stage IO-24" }

input_capture:
  - { name: TACHO, instance: FTM7, channel: 0, pin: PTB4, note: "FTM7 has no functional clock in TESTK1X" }

dio:
  outputs:
    - { name: LED, pin: PTD16 }
