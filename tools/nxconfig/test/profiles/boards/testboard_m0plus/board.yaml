# Synthetic board for the toolchain tests (PLAT-09): Cortex-M0+ derivative, one CAN bus, no crystal, no debug section.
schema_version: 1

board:
  name: testboard_m0plus
  mcu: TESTM0P32
  package: QFN32

devices:
  - { name: PHY, part: TJA1051 }

can:
  - { name: BUS, instance: CAN0, rx: { pin: PA0 }, tx: { pin: PA1 }, phy: PHY }

dio:
  outputs:
    - { name: LED, pin: PB0 }
