# SPDX-License-Identifier: Apache-2.0
# Example of a hand-written C component (RTE-20 test profile tools/rtegen/test/c_swc): a level monitor with a
# weighted moving average, a threshold with hysteresis and debounce, a signal qualifier of its own and a
# fixed-point gain. Generic on purpose - it knows no board; the ECU description (rte.yaml) decides where the level
# comes from. Code: src/LevelMonSwc.c (started with tools/swc/swc_skeleton.py create), values: LevelMonSwc_data.m.
version: 1
name: LevelMonSwc
description: Level monitor (weighted average, hysteresis with debounce, qualifier, scaled output)
implementation: c
runnables:
  - name: Run10ms
    period_ms: 10
  - name: Run100ms
    period_ms: 100
ports:
  - { name: Level_mV, direction: in, type: uint32, runnables: [Run10ms] }
  - { name: Filtered_mV, direction: out, type: uint32, runnables: [Run10ms] }
  - { name: Above, direction: out, type: boolean, runnables: [Run10ms] }
  - { name: LevelQlf, direction: out, type: uint8, runnables: [Run10ms] }      # QLF_* of Rte_Qlf.h
  - { name: Crossings, direction: out, type: uint16, runnables: [Run100ms] }
  - { name: Scaled, direction: out, type: uint16, runnables: [Run100ms] }
parameters:                     # values only in LevelMonSwc_data.m
  - { name: OnLevel_mV, type: uint32, runnables: [Run10ms] }
  - { name: OffLevel_mV, type: uint32, runnables: [Run10ms] }
  - { name: MaxLevel_mV, type: uint32, runnables: [Run10ms] }
  - { name: DebounceCycles, type: uint8, runnables: [Run10ms] }
  - { name: Weights, type: uint8, dim: 4, runnables: [Run10ms] }             # newest sample first
  - { name: Gain, type: uint16, lsb: 0.001, runnables: [Run100ms] }          # fixed point: physical = stored / 1000
