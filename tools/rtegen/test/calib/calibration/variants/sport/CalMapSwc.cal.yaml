# Calibration values of CalMapSwc - variant sport (delta on base). Format nextbsw-cal 1, tools/calgen (TOOL-145).
format: nextbsw-cal 1
component: CalMapSwc
values:
  TorqueLimit_Nm:
    value:
      - [130, 120, 95]     # SpeedAxis_rpm = 0 rpm
      - [170, 160, 130]    # SpeedAxis_rpm = 1000 rpm
      - [230, 210, 170]    # SpeedAxis_rpm = 2000 rpm
      - [210, 195, 160]    # SpeedAxis_rpm = 4000 rpm
      - [170, 160, 135]    # SpeedAxis_rpm = 6000 rpm
    status: checked
    author: "neXtBSW example"
    reason: "sport variant: more torque below 90 degC"
  BoostCurve:
    value: [0, 500, 1100, 1800, 2100]
    status: draft
    author: "neXtBSW example"
    reason: "sport variant: higher boost"
  MaxTorque_Nm:
    value: 280
    status: checked
    author: "neXtBSW example"
    reason: "sport variant"
  Mode:
    value: "Sport"
    status: checked
    author: "neXtBSW example"
    reason: "sport variant starts in mode Sport"
