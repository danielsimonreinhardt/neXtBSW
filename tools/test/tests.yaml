# Liste aller Host-Tests des Repositoriums (TOOL-04). Der Laeufer tools/test/run_tests.py fuehrt nur aus, was hier
# steht - nichts wird geraten. Ein Test, der den Suchmustern unter `inventory` entspricht und in keinem `covers`
# vorkommt, macht den Lauf rot ("NICHT IN tools/test/tests.yaml"), damit die Liste vollstaendig bleibt.
#
# Felder je Eintrag:
#   name          Kurzname fuer -k und den Bericht
#   group         python | pytest | host | build | target
#   kind          unittest | pytest | script | command | zig | cmake_preset
#   comment       was der Test deckt (Pflicht)
#   covers        Testdateien, die dieser Eintrag ausfuehrt (Grundlage der Vollstaendigkeitspruefung).
#                 TOOL-100: jede Testdatei aus covers muss bei pytest/unittest/script auch in args, bei zig in
#                 sources stehen, sonst ist die Liste fehlerhaft. Einzige Ausnahme: ein C/C++-Hosttest, den der
#                 Python-Test aus args selbst uebersetzt - dann muss diese Python-Datei ihn namentlich nennen.
#                 args wird bewusst NICHT aus covers abgeleitet (Optionen, -k-Teilung): tools/test/README.md
#   modules       optional (DOC-18): Module mit Manifest, die der Eintrag nachweislich prueft, obwohl keine Datei
#                 aus `covers` im Modulordner liegt - Modulname (`capture`) oder, falls mehrdeutig, Modulordner.
#                 Unbekanntes Modul = Liste fehlerhaft. Quelle der Spalte "Host tests" in doc/reference/modules.md
#   requirements  optional (SYS-22): Sicherheitsanforderungen aus doc/requirements/safety/ssr.sdoc (SSR-nnn), die der
#                 Eintrag nachweist - Grundlage der Rueckverfolgbarkeit, geprueft von tools/trace (safety-trace);
#                 DOC-21: auf dem StrictDoc-Modell (doc/requirements) auch BSR-/MOD-IDs
#   derivation    optional (SYS-67): wie die Testfaelle eines Sicherheits-Eintrags (mit `requirements`) abgeleitet
#                 sind - Werte aus doc/safety/verification-plan.md Abschnitt 5.1 (requirements-analysis,
#                 equivalence-classes, boundary-values, error-guessing, fault-injection, operational-use-cases,
#                 functional-dependencies); der Laeufer ignoriert das Feld, tools/ci/test_verification_plan.py prueft es
#   requires      Werkzeuge aus `tools`; fehlt eines, wird der Test "uebersprungen" statt rot
#   needs_files   Dateien, die vorher entstehen muessen (sonst uebersprungen mit Meldung)
#   after         laeuft erst nach diesen Eintraegen (auch bei --jobs N)
#   needs         Eintraege, die bauen, was dieser Eintrag benutzt (TOOL-52): laufen immer mit und zuerst, auch bei
#                 -k oder --group; ist einer nicht gruen, wird dieser Eintrag uebersprungen statt gegen Altes zu laufen
#   slow          nur mit --slow
#   parallel      false = laeuft allein (gemeinsame Ausgabepfade, lange Builds)
#   in_workspace  optional (TOOL-67), Vorgabe false: der Eintrag laeuft auch in einem Kunden-Workspace
#                 (tools/test --workspace). Nur fuer Eintraege, die eine Mechanik des Baums pruefen, auf die der
#                 Workspace selbst baut, im Baum laufen und nur in ihr {tmp} schreiben. Alles andere baut oder
#                 prueft die Projekte und Boards des Baums und gehoert nicht in die Pipeline eines Kunden;
#                 ein Workspace kann weitere Eintraege mit `inherit:` in seiner ci/tests.yaml selbst dazunehmen.
#                 Begruendung und Regeln: tools/test/workspace.py, tools/test/README.md
# Platzhalter in Pfaden und Argumenten: {python} {repo} {tmp} {build}; zusaetzlich {tree} (= {repo}, der
# neXtBSW-Baum) und {workspace} (im Baum-Lauf ebenfalls der Baum, im Workspace-Lauf das Kunden-Repo)

version: 1

groups: [python, host, build, target, matlab]

tools:
  ziglang:
    kind: python_module
    module: ziglang
    hint: "pip install -r tools/requirements.txt"
  pytest:
    kind: python_module
    module: pytest
  pyside6:
    kind: python_module
    module: PySide6
    hint: "GUI-Tests von neXtBSW Studio (TOOL-02), laufen offscreen"
  cmake:
    kind: executable
    name: cmake
  ninja:
    kind: executable
    name: ninja
  arm_gcc:
    kind: arm_gcc
    hint: "python -m tools.ci setup holt den gepinnten xPack GCC 11.3.1, NX_ARM_GCC_BIN auf dessen bin-Ordner setzen"
  openbsw:
    kind: path
    path: external/openbsw/platforms/s32k1xx/CMakeLists.txt
    hint: "git submodule update --init external/openbsw"
  strictdoc:
    kind: env
    name: NX_STRICTDOC_VENV
    hint: "StrictDoc-venv (DOC-21): python -m tools.ci setup --tool strictdoc; tools.ci setzt die Variable selbst, am Arbeitsplatz z. B. NX_STRICTDOC_VENV=%LOCALAPPDATA%/nextbsw/ci-cache/strictdoc-venv"
  svd:
    kind: env
    name: NX_SVD_DIR
    hint: "SVD-Sammlung, Arbeitsplatzebene (mcudb/s32k1xx/sources/keil_s32k116_dfp/README.md)"
  requirements_model:
    # PLAT-62: das Anforderungsmodell (doc/requirements, StrictDoc) ist privat und fehlt im offenen Export
    # (tools/distcheck/distribution.yaml) - Eintraege, die es lesen, werden dort uebersprungen statt rot
    kind: path
    path: doc/requirements/safety/ssr.sdoc
    hint: "privates Anforderungsmodell doc/requirements, nicht im offenen Export (PLAT-62)"
  mkdocs:
    # DOC-71: Doku-Website; die Pakete stehen in einer eigenen Datei, nicht in tools/requirements.txt
    kind: python_module
    module: mkdocs
    hint: "pip install -r tools/requirements-site.txt"
  full_tree:
    # PLAT-62: der vollstaendige private Stand - interne Planung (doc/todo.yaml mit erledigten Aufgaben, daraus
    # doc/TODO.md), vollstaendige Testliste mit Studio-Gruppe, Doku-Referenz mit privaten Modulen. Der offene Export
    # fuehrt davon nur bereinigte Fassungen; Eintraege, die den vollen Stand pruefen, werden dort uebersprungen
    kind: path
    path: doc/TODO.md
    hint: "vollstaendiger privater Stand (interne Planung, volle Testliste), im offenen Export bereinigt (PLAT-62)"
  git_repository:
    # PLAT-62: der Baum ist ein git-Repository (im Worktree eine Datei .git) - der offene Export schreibt ohne
    # --git-init keins; Eintraege, die die Historie des Baums brauchen, werden dort uebersprungen
    kind: path
    path: .git
    hint: "kein git-Repository (offener Export ohne --git-init, PLAT-62)"
  matlab:
    # TOOL-97: die Probe sieht nur in den PATH. Der Studio-Werkzeugtest (tools/studio/core/toolcheck.py,
    # find_matlab) sucht zusaetzlich NX_MATLAB und die Standardordner - wer MATLAB nur dort hat, bekommt hier
    # "uebersprungen" statt "gruen". Das ist die sichere Richtung (nie rot aus dem falschen Grund), aber es ist
    # nicht dieselbe Suche; wer beides angleichen will, braucht eine eigene Probenart im Laeufer.
    kind: executable
    name: matlab
    hint: "MATLAB mit Simulink und Embedded Coder; matlab in den PATH legen (Studio: auch NX_MATLAB)"

defaults:
  zig:
    driver: c++
    std: c++17
    flags: [-O1, -Wall, -Wextra, -Wconversion, -Wno-sign-conversion, -Werror]
    requires: [ziglang]
    timeout: 600

inventory:
  patterns: ["test_*.py", "*HostTest.cpp", "*HostTest.c", "*_host_test.cpp", "*_sil_test.c"]
  skip_dirs: [external, build, .venv, .git, .claude, __pycache__, node_modules, generated]
  # Testdateien, deren Eintrag der Export entfernt hat (tools/distcheck)
  ignore: [bootloader/test/test_bl_image_version.py, bootloader/test/test_bl_reset_path_elf.py, doc/requirements/safety/ssr.sdoc, doc/safety/board-test-spec.md, doc/safety/test/test_safety_plan.py, ecu/safety/safeSupervisor/test/test_hold_console_elf.py, ecu/uds/test/host/test_app_uds_dtc.py, ecu/uds/test/host/test_app_uds_host.py, ecu/uds/test/host/test_app_uds_identification.py, ecu/uds/test/host/test_app_uds_product.py, platforms/s32k1xx/bsp/bspCsec/test/test_csec.py, platforms/s32k1xx/hardFaultHandler/test/test_safe_outputs_order.py, platforms/s32k1xx/hardFaultHandler/test/test_safe_outputs_table.py, platforms/s32k1xx/port/main/src/integration/test/test_deadman_expected_elf.py, platforms/s32k1xx/port/main/src/integration/test/test_safety_fault_injection_guard.py, platforms/s32k1xx/port/main/src/os/isr/test/host/KernelFaultReactionHostTest.cpp, platforms/s32k1xx/port/main/src/osHooks/test/test_freertos_config.py, platforms/s32k1xx/port/main/test/test_low_voltage_detect_reset_elf.py, platforms/s32k1xx/port/safety/safeMemory/test/test_ecc_latent_test_elf.py, platforms/s32k1xx/port/safety/safeMemory/tools/test/test_rom_check_image.py, swc/DemoSwc/test/DemoSwc_sil_test.c, swc/DemoSwcSubstitute/src/DemoSwc.c, swc/DemoSwcSubstitute/swc.yaml, swc/DemoSwcSubstitute/test/assemble.py, swc/DemoSwcSubstitute/test/target_build.py, tools/boardtest/cli.py, tools/boardtest/suite.py, tools/boardtest/test_suite.py, tools/bswgen/test/no_io_target_compile.py, tools/canflash/test_info_host.py, tools/elfcheck/test/product_build.py, tools/elfcheck/test/test_elfcheck.py, tools/elfcheck/test/test_timing.py, tools/rtegen/test_rtegen_nvm.py, tools/rtegen/test_rtegen_nvm_blocks.py, tools/stackuse/test/test_stackuse.py, tools/swc/swc_load_qlf.m, tools/swc/swc_measurements.m, tools/swc/test/SwcLoadQlfTest.m, tools/swc/test/fixtures/RateImportSwc/RateImportSwc_model.m, tools/swc/test/fixtures/TypeYamlSwc/TypeYamlSwc_logic.m, tools/swc/test/fixtures/TypeYamlSwc/swc.yaml, tools/swc/test/types_flow.py]

tests:

  # ---------------------------------------------------------------- Gruppe python: Python-Unittests
  - name: nxconfig
    group: python
    kind: pytest
    comment: Konfigurationsmodell Projekt/Board/Derivat, Bezuege, Ressourcenkonflikte, Meldungen mit YAML-Pfad
    args: [tools/nxconfig/test_nxconfig.py, --deselect, "tools/nxconfig/test_nxconfig.py::MemoryTest::test_build_settings_features_and_pll", --deselect, "tools/nxconfig/test_nxconfig.py::MemoryTest::test_s32k116evb_profile_checks", --deselect, "tools/nxconfig/test_nxconfig.py::RteRequiredTest::test_a_built_project_without_rte_is_refused_with_file_and_path", --deselect, "tools/nxconfig/test_nxconfig.py::RteRequiredTest::test_the_hint_of_the_message_is_enough", --deselect, "tools/nxconfig/test_nxconfig.py::RteRequiredTest::test_a_configuration_only_profile_is_not_refused_by_nxconfig_but_by_rtegen", -q, -k, "not Rm4xClockTest"]
    covers: [tools/nxconfig/test_nxconfig.py]
    timeout: 1500
    requirements: [SSR-030]
    derivation: [requirements-analysis, equivalence-classes]

  - name: nxconfig-new
    group: python
    kind: unittest
    comment: >
      Neues Projekt (TOOL-59): Namens- und Ordnerregeln, leeres Projekt aus Board und Derivat (synthetische Boards auf
      TESTMCU64, S32K142, S32K116 und RM46L852, nicht das Eval Board) ohne nxconfig-Fehler, Kopie mit umgeschriebenen
      Pfaden ohne Build-Ausgaben, alles-oder-nichts beim Schreiben, Kommandozeile nxconfig new
    args: [tools/nxconfig/test_newproject.py, tools/nxconfig/test_newproject_workspace.py]
    covers: [tools/nxconfig/test_newproject.py, tools/nxconfig/test_newproject_workspace.py]
    timeout: 900

  - name: nxconfig-projectbuild
    group: python
    kind: unittest
    comment: >
      PLAT-114: offene Bau-Hilfe der Ziel-Bau-Pruefungen (nxconfig/projectbuild.py) und die Konfigurier-Argumente
      aus dem Basis-Preset (nxconfig/presets.py), die auch das Studio verwendet - Reihenfolge, eigene Werte, PATH mit
      NX_ARM_GCC_BIN, Ausgabe/Fehler eines Schritts, kein Import des Studios. Offenes Bau-Profil
      buildtest_s32k148_min, nichts wird gebaut
    args: [tools/nxconfig/test_projectbuild.py]
    covers: [tools/nxconfig/test_projectbuild.py, tools/nxconfig/projectbuild.py, tools/nxconfig/presets.py]
    timeout: 300

  - name: nxconfig-pinevent
    group: python
    kind: pytest
    comment: >
      Pin-Ereignisse (IO-51): Derivat-Fakt pin_interrupts aller vier Familien (S32K14x Vektor je Port, S32K11x ein
      Vektor, STM32 EXTI-Leitung je Pinnummer, S32K3 EIRQ nur an den Pins der Tabelle, RM46 GIO auf Anforderung A
      oder B), Modellpruefungen, Projektpruefungen mit YAML-Pfad (Rang, gemeinsamer Vektor, gemeinsame Leitung,
      Hall-Signale, Flanke, Entprellung gegen Ratengrenze, Wake-up reserviert) auf erfundenen Derivaten, RM46 und
      einer Kopie des Demo-Projekts; Demo selbst unveraendert und meldungsfrei
    args: [tools/nxconfig/test_pinevent.py, -q, -k, "not (test_stm32_line_per_pin_number or test_s32k3_eirq_only_at_the_pins_of_the_table or test_rm46_gio_pins_on_either_request or Rm46)"]
    covers: [tools/nxconfig/test_pinevent.py]
    timeout: 600

  - name: nxconfig-hwthreshold
    group: python
    kind: unittest
    comment: >
      SYS-86: Hardware-Schwelle (Komparator -> Fault-Eingang des PWM-Timers) in tools/nxconfig/hwthreshold.py -
      mcudb-Fakten CMP0 der S32K14x (Belege RM/DS, S32K116 bewusst nicht beschrieben), Umkehrung der Kennlinie und
      Rundung zur sicheren Seite gegen Handrechnung (oben/unten, Bandgap, fallende Kennlinie, Band aus Offset/INL/
      Referenz), Filter in Timer-Takten, Reaktionszeit; jede Ablehnung mit YAML-Pfad (Eingang, Komparator, Pin,
      Debug-Pin, Pin-Konflikt, Signal, PWM-Gruppe, Timer ohne Weg, ein Komparator je Schwelle, Versorgung, Bereich,
      Filter); eigenes Profil testproject_hw_threshold, Demo unveraendert
    args: [tools/nxconfig/test_hwthreshold.py]
    covers: [tools/nxconfig/test_hwthreshold.py]
    timeout: 900

  - name: nxconfig-samplegroup
    group: python
    kind: unittest
    comment: >
      IO-62: Messgruppen (PWM-Trigger -> TRGMUX -> PDB -> ADC) in tools/nxconfig/samplegroup.py - mcudb-Fakten
      TRGMUX-Codes/-Ausgaenge und PDB der S32K14x (Belege RM, S32K116 bewusst nicht beschrieben), Abtastzeitpunkte,
      Ende der Gruppe und abschliessender Sequenzer gegen Handrechnung, Warnung mit Zeitversatz bei gleichem ADC,
      Mittelung; jede Ablehnung mit YAML-Pfad (PWM-Gruppe, Trigger, Timer ohne Eingang, Kanaele, Pin, exklusiver ADC
      gegen Software-Wandlung, Sequenzer-Plaetze, ein ADC je Gruppe, TRGMUX-Ausgang/-Sperre der Hardware-Schwelle
      SYS-86, Zaehlerbreite, Periode, Interrupt-Rang); eigenes Profil testproject_sample_group, Demo unveraendert
    args: [tools/nxconfig/test_samplegroup.py]
    covers: [tools/nxconfig/test_samplegroup.py]
    timeout: 900

  - name: nxconfig-identity
    group: python
    kind: unittest
    comment: >
      PLAT-79: Konfigurations- und Generatorkennung (tools/nxconfig/identity.py, Vorschlag C TF4) - doppeltes
      Erzeugen bitgleich (bswgen im Prozess und in zwei Prozessen mit anderem Hash-Seed/Arbeitsordner, rtegen,
      diaggen), keine Pfade/Zeit im Generat; Kopie an anderem Ort und mit CRLF gleiche Kennung, geaenderte Eingabe
      aendert nur die Konfigurationssumme; Manifest je Generator mit SHA-256 jeder Datei und gleicher Kennung;
      Header kompiliert mit dem echten Identity.cpp (zig); nxconfig identity; eigene Profile testproject_safe_outputs
      und buildtest_s32k148_min
    args: [tools/nxconfig/test_identity.py]
    covers: [tools/nxconfig/test_identity.py]
    timeout: 1200
    requires: [ziglang, openbsw]
    requirements: [SSR-082]
    derivation: [requirements-analysis, equivalence-classes]

  - name: nxconfig-binding
    group: python
    kind: unittest
    comment: >
      ARCH-52: Manifestfelder der generierten Modulanbindung mit YAML-Pfad - binding nur fuer Geraetetreiber, mit
      lifecycle, Stufe 1/2, BSW-Task des Task-Manifests, Vertraege der Familien-Binder (spi_device: 1), RTE-Zugriff
      reading, vorhandener Header; connect.<x>.optional (offen erlaubt, nicht mit safe_off); max_instances am
      Projekteintrag; eigenes Profil testproject_binding mit dem synthetischen Modul
    args: [tools/nxconfig/test_binding.py]
    covers: [tools/nxconfig/test_binding.py]
    timeout: 600

  - name: nxconfig-degraded
    group: python
    kind: unittest
    comment: >
      SYS-117: Degradationsbetrieb SD in tools/nxconfig/degraded.py - geschlossene Liste und Ereignisnummern aus dem
      Code des SafeSupervisor (Degraded.h, SafeSupervisor.h), jede Ablehnung mit YAML-Pfad (MCU-interne Ereignisse,
      unbekanntes Ereignis/Geraet/Gruppe, Gruppe leer oder doppelt, Zuordnung doppelt, PWM-Gruppe in keiner oder
      zwei Gruppen, zwei Gruppen auf einem Timer, mehr als 8 Gruppen/16 Zuordnungen, ohne Fehlerspeicher, ohne
      Supervisor), Warnungen (alle Gruppen, safe_off ohne Gruppe bis IO-45, verlorener Bus mit nicht zugeordnetem
      Geraet, Gruppen ohne Zuordnung), abgeleitete Worte und Busgruppen; Demo ohne Zuordnung ohne neuen Wert, Kopie
      mit Zuordnung: Tabellenreihenfolge wie bswgen, Bus-Kennung wie rtegen, erzeugter Kopf
    args: [tools/nxconfig/test_degraded.py]
    covers: [tools/nxconfig/test_degraded.py]
    timeout: 600
    requirements: [SSR-088]
    derivation: [requirements-analysis, equivalence-classes, boundary-values]
  - name: nxconfig-safestate
    group: python
    kind: unittest
    comment: >
      SYS-116: sichere Zustaende einer PWM-Gruppe in tools/nxconfig/safestate.py - Freilauf Pflicht, nichts doppelt,
      Kurzschluss oben nur mit high_side_hold, Starttest mit Dauer und nur mit Kurzschluss, Warnungen (kein
      Gate-Treiber, Reset-Zustand Freilauf/unbekannt, Kurzschluss ohne Starttest), Familie ohne Kurzschluss, die
      beiden Code-Fakten (Supervisor C4, Familienport C2) aus dem Baum gelesen und ohne sie Ablehnung; Demo unveraendert
    args: [tools/nxconfig/test_safestate.py]
    covers: [tools/nxconfig/test_safestate.py]
    timeout: 600
    requirements: [SSR-090, SSR-091, SSR-092]
    derivation: [requirements-analysis, equivalence-classes]
  - name: nxconfig-bsw-tasks
    group: python
    kind: unittest
    comment: >
      PLAT-26: Stacks und Zusammenlegen der BSW-Tasks als Projektwerte (tools/nxconfig/bswtasks.py) - eigenes
      Task-/Stackprofil (Mindestgroesse, Raster, erlaubte Zusammenlegung, nie safety, keine Kette, Warnung unter
      der Vorgabe), Manifest ecu/configuration/taskStacks.yaml gleich dem Abbild vor PLAT-26, Summe gegen den
      Anwendungs-RAM mit YAML-Pfad (Profil testproject_s32k142_bl), Demo unveraendert. PLAT-107: unter der
      Vorgabe ohne Nachweisvermerk (evidence) im ASIL-Projekt Fehler, bei qm Warnung; Stack muss den Nachweis
      fassen; mit Endstufe/Gate-Treiber nur run_in_power_stage (background -> bsp in einer Demo-Kopie abgelehnt)
    args: [tools/nxconfig/test_bswtasks.py]
    covers: [tools/nxconfig/test_bswtasks.py]
    timeout: 600
  - name: nxconfig-console
    group: python
    kind: unittest
    comment: >
      PLAT-27: Konsole und Logger als Projektfunktion (tools/nxconfig/console.py) - project.yaml console.enabled
      wird NX_CONSOLE, console.logger_buffer_bytes wird NX_LOGGER_BUFFER_BYTES (nur mit Projektwert, sonst bleibt
      die Vorgabe der Wurzel-CMakeLists); Meldungen mit YAML-Pfad (unter der Vorgabe, ausserhalb 512..65536,
      groesser als der Anwendungs-RAM, Wert ohne Logger); Profil testproject_s32k142_bl, Demo unveraendert
    args: [tools/nxconfig/test_console.py]
    covers: [tools/nxconfig/test_console.py]
    timeout: 600
  - name: nxconfig-isr-stack
    group: python
    kind: unittest
    comment: >
      SYS-132: Interrupt-Stack und Schutzbereich als Projektwert (memory.application.isr_stack_size /
      isr_stack_guard_size) - Layout und memoryLayout.h nur mit Projektwert (NX_MEMORY_APP_ISR_STACK_SIZE /
      _GUARD_SIZE), Raster 8 / 32 als Fehler mit YAML-Pfad, unter der Vorgabe Warnung, RAM-Summe mit Projektwert
      (Profil testproject_s32k142_bl), Demo-memoryLayout.h bytegleich zur Referenz
    args: [tools/nxconfig/test_isr_stack.py]
    covers: [tools/nxconfig/test_isr_stack.py]
    timeout: 600
  - name: rtegen-bsw-tasks
    group: python
    kind: unittest
    comment: >
      PLAT-26: tasks/BswTasks.h und Kontext-Aliase in async/Config.h (tools/rtegen) - Profil test/multitask mit
      eigenem Stackmanifest, zusammengelegter Task ohne Prioritaet und Name belegt, Fehler mit project.yaml-Pfad,
      Demo mit den Stacks vor PLAT-26
    args: [tools/rtegen/test_rtegen_bsw_tasks.py]
    covers: [tools/rtegen/test_rtegen_bsw_tasks.py]
    timeout: 600
  - name: nxconfig-pwm-alignment
    group: python
    kind: unittest
    comment: >
      IO-61: pwm.<gruppe>.alignment (edge/center) und trigger.point (zero_low/zero_high) - Vorgabe edge wie vor
      IO-61, center halbiert den Zaehlbereich statt der Frequenz (gleiche Frequenz und Totzeit, kleinerer Vorteiler),
      Grenzen je Zaehlrichtung mit YAML-Pfad, Schemafehler; eigenes s32k1xx-Profil 64 MHz
    args: [tools/nxconfig/test_pwm_alignment.py]
    covers: [tools/nxconfig/test_pwm_alignment.py]
    timeout: 600

  - name: nxconfig-workspace
    group: python
    kind: unittest
    comment: >
      neXtBSW-Version (ARCH-55: VERSION als einzige Quelle, CMake/Studio lesen sie, nxconfig version) und
      Workspace-Pin nextbsw.yaml (ARCH-56): Schema, Suche nach oben ab project.yaml mit Halt an neXtBSW-Baum und
      git-Repo, Rueckfall auf den laufenden Baum, Suchpfade vor den Ordnern des Baums, Doppelte mit beiden Pfaden,
      Versionsabgleich; synthetischer Workspace in %TEMP% mit eigenem Board, Derivat und Modul
    args: [tools/nxconfig/test_workspace.py]
    covers: [tools/nxconfig/test_workspace.py]
    timeout: 600
    # TOOL-67: laeuft auch im Workspace-Lauf - er steht und faellt mit genau dieser Mechanik (Pin, Version,
    # Suchpfade); der Test baut seinen eigenen synthetischen Workspace in %TEMP% und ruehrt den Baum nicht an
    in_workspace: true

  - name: nxconfig-running-tree
    group: python
    kind: unittest
    comment: >
      TOOL-85: nxconfig.check(running_tree=...) statt der Modulvariable REPO. Der Aufrufer sagt, aus welchem Baum
      er laeuft; Vorgabe bleibt der Baum, in dem das Paket liegt, also lehnt die Kommandozeile einen Pin auf einen
      anderen Baum weiterhin ab. Zwei erfundene Baeume in %TEMP% (talvi, kesa) mit je eigenem Derivat, eigener
      Familien-Portvorlage und eigenem Board-Port und je einem Kunden-Workspace: mit dem Parameter prueft das
      Projekt fehlerfrei, ohne ihn bleibt es abgelehnt; mcudb, Modulordner und die Portordner (FAMILY_PORTS,
      BOARD_PORTS sind nicht mehr beim Import gebunden) folgen dem Parameter; zwei Pruefungen laufen gleichzeitig
      in zwei Threads, ohne dass eine globale Variable umgesetzt wird
    args: [tools/nxconfig/test_running_tree.py]
    covers: [tools/nxconfig/test_running_tree.py]
    timeout: 600
    # wie nxconfig-workspace: der Test baut seine Baeume und Workspaces selbst in %TEMP% und ruehrt den Baum nicht an
    in_workspace: true

  - name: nxconfig-running-tree-generators
    group: python
    kind: unittest
    comment: >
      TOOL-87: running_tree durch alle vier Werkzeuge, die das Studio im selben Block ruft (nxconfig, diaggen,
      bswgen, rtegen). Ein Pin auf einen zweiten erfundenen Baum (Fixture aus TOOL-85, Baeume aalto und virta in
      %TEMP%) wird ohne den Parameter von jedem der vier mit genau derselben Meldung abgelehnt und mit ihm von
      jedem geprueft; jeder Generator kommt dabei bis zu seiner eigenen Stufe (diaggen Standardbeschreibung,
      bswgen kennt die erfundene Familie nicht, rtegen vermisst die ECU-Beschreibung). Derivat-Datenbank und
      Modulordner folgen dem Baum (in bswgen waren sie Vorgabewerte, beim Import gebunden), auch die zweite
      Stelle in bswgen (show_nvm_partition, NVM-07) und diaggen.load_project; keine Modulvariable wird umgesetzt,
      und die vier Werkzeuge laufen gleichzeitig in vier Threads gegen zwei Baeume - der Beleg, dass as_tool_of()
      und _TOOL_LOCK im Studio entfallen koennen
    args: [tools/nxconfig/test_running_tree_generators.py]
    covers: [tools/nxconfig/test_running_tree_generators.py]
    timeout: 600
    # wie nxconfig-running-tree: baut seine Baeume und Workspaces selbst in %TEMP% und ruehrt den Baum nicht an
    in_workspace: true

