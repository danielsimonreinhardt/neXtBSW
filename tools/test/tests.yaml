      von master erreichbar, sauber, Overlays derselben Version; Entwicklungs-Pin (kein Tag) nur Warnung, mit
      --release Fehler. Synthetische git-Repositorien in %TEMP% je Fall (annotierter Tag, leichter Tag, kein Tag,
      anderer Tag, Tag weiter hinten, Tag am Seitenzweig, kein master, schmutziger Baum, kein git-Checkout,
      Overlays); Meldungen mit Datei, Zeile und YAML-Pfad, Zeilensuche ohne ruamel, Kommandozeile nxconfig pin
    args: [tools/nxconfig/test_pincheck.py]
    covers: [tools/nxconfig/test_pincheck.py, tools/nxconfig/pincheck.py]
    timeout: 900
    # TOOL-65: gehoert wie der Pin selbst in den Workspace-Lauf - er baut seine eigenen Repositorien in %TEMP%
    in_workspace: true

  - name: nxupdate
    group: python
    kind: unittest
    comment: >
      Update-Workflow eines Kunden-Workspace (TOOL-64, Luecke N9): Generieren vor/nach mit Baum-Subprozessen
      (bswgen/rtegen der jeweiligen Baumversion, kein Kompilieren), Pin-Wechsel mit Tag-Pruefung (TOOL-65) ueber
      einen git-worktree statt eines Klons (kein Netzwerk, ruehrt den echten Submodul-Checkout im Trockenlauf
      nicht an), Migrationen ueber tools/nxconfig des Ziel-Baums (TOOL-66), Bericht mit Diff der erzeugten
      Dateien und feldrelevanten Aenderungen (Speicherlayout, CAN-IDs, Diagnoseadressen, Records) per Heuristik
      auf Pfad und geaenderten Zeilen; zwei erfundene Releases (mit einem uebersprungenen dazwischen) in einem
      erfundenen Upstream-Repo in %TEMP% mit Stub-Generatoren je Version, echter Migrationslauf zusaetzlich
      gegen tools/nxconfig dieses Baums (nur lesend); Standard Trockenlauf, --write/--commit einzeln geprueft,
      committet aber pusht nie
    args: [tools/nxupdate/test_nxupdate.py]
    covers: [tools/nxupdate/test_nxupdate.py, tools/nxupdate/update.py]
    timeout: 900
    # wie nxconfig-pin: baut sein eigenes Upstream-Repo und seinen eigenen Workspace in %TEMP%, ruehrt den Baum
    # dieses Repos nicht an (der einzige echte Baum-Zugriff ist ein lesender Migrationslauf gegen tools/nxconfig)
    in_workspace: true

  - name: nxupdate-workspace
    group: python
    kind: unittest
    requires: [git_repository]   # PLAT-62: im offenen Export uebersprungen
    comment: >
      TOOL-215 (Befund DOC-36): nxupdate auf einem echten Kunden-Workspace mit den echten Generatoren statt
      Stubs - lokaler Bare-Klon dieses Repos in %TEMP%/s32k mit zwei erfundenen annotierten Releases (9.0.0 = HEAD,
      9.1.0 mit je einer Kommentarzeile in zwei bswgen-Vorlagen), Kunden-Repo mit dem Baum als echtem Submodul und
      external/openbsw per --reference aus dem lokalen Checkout (kein Netz), Projekt und Board aus buildtest_s32k148
      ausserhalb des Baums. Trockenlauf mit relativem Pfad (frueher ValueError), Trockenlauf mit --tree
      (Verzeichnis-Link wird entfernt, Baum bleibt) und --write --commit ueber die Kommandozeile: keine
      Generierungsprobleme, nur die zwei Vorlagen-Dateien (eine feldrelevant) und die Identitaetsdateien
      geaendert, nichts 'entfernt', Exit 0, danach nxconfig check des neuen Baums gruen; zuletzt ein Lauf auf
      dieselbe Version (Fall DOC-36) ohne jeden Unterschied
    args: [tools/nxupdate/test_nxupdate_workspace.py]
    covers: [tools/nxupdate/test_nxupdate_workspace.py, tools/nxupdate/update.py, tools/nxupdate/__main__.py]
    # 27 min unter Volllast (Nacht-Welle 02.10., fuenf parallele Agenten): vier nxupdate-Laeufe mit echten Generatoren
    timeout: 3600

