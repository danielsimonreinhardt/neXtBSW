  # (Eintrag target-product beim Export entfernt: Inhalt nicht im Profil)
  # ---------------------------------------------------------------- Gruppe matlab: MATLAB/Simulink (TOOL-97)
  # Bis TOOL-97 stand keiner der beiden Modelltests in dieser Liste: sie liefen nur, wenn jemand daran dachte -
  # und MATLAB ist genau die Umgebung, an die niemand denkt. Sie stehen in einer eigenen Gruppe, weil `host`
  # ausdruecklich die C/C++-Tests ueber ziglang meint; `--group matlab` waehlt jetzt genau diese beiden.
  #
  # requires: [matlab] -> ohne MATLAB im PATH werden sie UEBERSPRUNGEN, nicht rot (wie strictdoc). Eine fehlende
  # Lizenz faengt das nicht ab: matlab liegt dann im PATH, der Lauf bricht ab und der Eintrag wird rot. Sie sind
  # ausserdem slow: true - ein gewoehnlicher `tools/test`-Lauf waehlt sie gar nicht erst aus; CI nennt
  # MATLAB/Simulink in tools/ci/pipeline.toml [[outside]], deshalb stehen beide dort unter allowed_skips.
  #
  # parallel: false ist hier mehr als "lange Builds": nur so laeuft hoechstens EIN MATLAB gleichzeitig. Der
  # Laeufer kennt keine Betriebsmittelsperre - er arbeitet alle nicht-parallelen Eintraege einer Welle
  # nacheinander ab und startet erst danach die parallele Welle. Das traegt genau solange, wie jeder Eintrag,
  # der MATLAB braucht, auch parallel: false setzt; ein kuenftiger Eintrag mit requires: [matlab] und
  # parallel: true wuerde die Regel still aushebeln, und gegen ein gleichzeitig laufendes Studio (dessen
  # Sperrdatei nextbsw-studio-matlab.lock dieser Laeufer nicht anfasst) schuetzt sie ohnehin nicht.
  #
  # Zeitgrenze 1260 s = knapp das Dreifache der 420 s, die der TOOL-14-Bericht fuer SwcPortsTest auf einem
  # unbelasteten Rechner gemessen hat. Sie ist bewusst NICHT aus der Messung dieses Baums abgeleitet: dort lief
  # SwcPortsTest 1094 s und SwcCreateTest 544 s (Wanduhr, einschliesslich ~2 min MATLAB-Start), aber der Rechner
  # stand unter Volllast und C: hatte noch 18 MB frei - MATLAB meldete selbst "low available disk space". Eine aus
  # solchen Zahlen gebildete Grenze waere so gross, dass sie keinen Haenger mehr faengt. Fuer SwcCreateTest gibt es
  # keine eigene Messung auf ruhigem Rechner; der Eintrag uebernimmt dieselbe Grenze, weil beide Tests derselben
  # Groessenordnung sind (Create: 9 Faelle, zwei Codegenerierungslaeufe; Ports: 8 Faelle, einer). Reisst eine der
  # beiden Grenzen, ist unter Last zuerst die Last zu verdaechtigen: den Eintrag allein wiederholen und beide
  # Zahlen nennen. Ein FEHLGESCHLAGENER Testfall ist dagegen nie "nur die Umgebung".
  - name: swc-matlab-create
    group: matlab
    kind: command
    comment: >
      RTE-07: swc_create, swc/template und der NxSwcLib-Block SensorQualifier in MATLAB/Simulink - Modell aus
      swc.yaml erzeugt, Codegenerierung ueber swc_build, ARXML, QLF-Konstanten gegen die Fixture aus rtegen,
      Vorrang und Entprellung des Qualifiers, bestehendes Modell bleibt erhalten, Bibliothek gleich ihrem Skript.
      Alles in einem temporaeren Ordner; in swc/ wird nichts geschrieben. 9 Faelle; 544 s am 2026-09-24, aber
      unter Volllast gemessen - keine belastbare Zahl fuer einen ruhigen Rechner
    argv: [matlab, -batch, "results = runtests('tools/swc/test/SwcCreateTest.m'); assertSuccess(results)"]
    expect: "\\d+ Passed, 0 Failed, 0 Incomplete"
    covers: [tools/swc/test/SwcCreateTest.m]
    requires: [matlab]
    slow: true
    parallel: false
    timeout: 1260

  - name: swc-matlab-ports
    group: matlab
    kind: command
    comment: >
      TOOL-14: swc_ports an einem bestehenden Modell - Ports anlegen, umbenennen, entfernen und abhaengen, Bericht
      ueber jeden Port, verweigertes Entfernen eines benutzten Ports, Sicherung vor dem ersten Schreiben, geaenderte
      Ports bis ins ARXML. Jeder Fall vergleicht Block- und Linienliste des ganzen Modells vor und nach der
      Aenderung. 8 Faelle; 420 s auf unbelastetem Rechner (TOOL-14-Bericht), davon 325 s der eine Fall mit
      Codegenerierung - am 2026-09-24 unter Volllast 1094 s bzw. 728 s. TOOL-107: die Fixture hat verzweigte
      Linien (Wurzel und Teilsystem), dazu Faelle fuer das Zaehlen je Ziel, einen verlorenen Zweig, Umbenennen und
      Entfernen eines verzweigten Ports und den Arbeitsordner von swc_build als Argument - jetzt 14 Faelle, nur
      einer davon mit Codegenerierung
    argv: [matlab, -batch, "results = runtests('tools/swc/test/SwcPortsTest.m'); assertSuccess(results)"]
    expect: "\\d+ Passed, 0 Failed, 0 Incomplete"
    covers: [tools/swc/test/SwcPortsTest.m]
    requires: [matlab]
    after: [swc-matlab-create]
    slow: true
    parallel: false
    timeout: 1260

