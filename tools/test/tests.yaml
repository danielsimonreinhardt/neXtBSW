      # compiled by that test with and without a PWM group (ARCH-17), so it needs no entry of its own
      - tools/bswgen/test/pwm_host/no_pwm_group_host_test.cpp
      # IO-18: jeder Rohwert von analogSensorConfiguration.h, demo + testproject_sensors, Mutanten
