  - name: rom-check
    group: host
    kind: zig
    comment: >
      SYS-38 (Befund Board 2026-09-21, Sitzung d3: Pruefsummenliste nicht im Abbild): echtes RomCheck.cpp und
      RomCheckList.h gegen ein Registermodell der S32K1-CRC-Einheit - bekannter Vektor wie der Python-Test,
      gueltiges Abbild besteht (je Wort genau ein CRC-Schreiben), jedes einzelne gekippte Bit in einem Bereich ->
      ROMCHECK_FAILED, unplausible Liste (geloescht wie am Board, 0/zu viele Bereiche, Laenge, Ausrichtung,
      vertauscht, ausserhalb) -> ROMCHECK_INVALID_LIST ohne Zugriff auf CRC-Einheit oder Listenadressen,
      RomCheck::idle() mit geloeschter Liste loest den Monitor einmal in der Safety-Shell aus. SYS-44 (Testprofil
      mit eigener Periode 2500 ms): nichts vor init(), erster Durchlauf sofort, danach erst nach der Periode (Start zu
      Start, auch ueber den Ueberlauf der Millisekunden), Periode 0 = einmal je Start, Verfaelschung nach dem ersten
      Durchlauf von der Wiederholung gefunden, Selbsttest der CRC-Einheit (Wert des Python-Modells; Einheit auf der
      Referenz festgefahren oder Polynom-Bit verloren -> ROMCHECK_UNIT_FAILED), offener Flash-Schreibvorgang oder
      laufendes Flash-Kommando (FSTAT CCIF) verschiebt ohne Zugriff auf die CRC-Einheit, Schreibvorgang waehrend des
      Durchlaufs verwirft ihn ohne Meldung, mehr als eine Periode verschoben -> ROMCHECK_OVERDUE einmal (Periode 0
      nie), Durchlauf ausserhalb der Safety-Shell und keine Shell je Runde beim Warten, Anzeiger zaehlt unter Sperre.
      SYS-91 (Bereich mit eigener Referenz = Kalibriersegment): Registrierung in der Shell, uebersteht init(),
      anderer Inhalt laesst die Liste gruen, Bitkipper nach dem ersten Durchlauf -> ROMCHECK_OWN_AREA_FAILED einmal
      in der Shell, bei Listenfehler nicht gefragt, Flash-Schreiben waehrend der Pruefung verwirft den Durchlauf
    include:
      - platforms/s32k1xx/port/safety/safeMemory/test/host/romCheckStubs
      - platforms/s32k1xx/port/safety/safeMemory/include
    sources:
      - platforms/s32k1xx/port/safety/safeMemory/test/host/RomCheckHostTest.cpp
    covers: [platforms/s32k1xx/port/safety/safeMemory/test/host/RomCheckHostTest.cpp]
    modules: [safeMemory]
    requirements: [SSR-024, SSR-025, SSR-067]
    derivation: [requirements-analysis, equivalence-classes, boundary-values, error-guessing, fault-injection]

