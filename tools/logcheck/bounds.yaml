macros:
  - name: NX_UDS_BUS_NAME
    max: 16
    evidence: >
      Written by tools/rtegen as the name of the CAN bus of ecu/uds; DiagSystem.cpp asserts it against
      CanFrameLog::BUS_NAME_CHARS in every family (ARCH-43), tools/nxconfig reports a longer bus name in the
      project before the build.
    proof:
      - {kind: contains, file: libs/bsw/canSystem/include/can/CanFrameLog.h,
         text: "static constexpr size_t BUS_NAME_CHARS = 16U;"}
      - {kind: contains, file: ecu/uds/src/systems/DiagSystem.cpp,
         text: "static_assert(sizeof(NX_UDS_BUS_NAME) - 1U <= ::can::CanFrameLog::BUS_NAME_CHARS,"}
  - name: NX_XCP_BUS_NAME
    max: 16
    evidence: Written by tools/rtegen as the name of the XCP bus; XcpSystem.cpp asserts it like NX_UDS_BUS_NAME.
    proof:
      - {kind: contains, file: libs/bsw/canSystem/include/can/CanFrameLog.h,
         text: "static constexpr size_t BUS_NAME_CHARS = 16U;"}
      - {kind: contains, file: ecu/xcp/src/systems/XcpSystem.cpp,
         text: "static_assert(sizeof(NX_XCP_BUS_NAME) - 1U <= ::can::CanFrameLog::BUS_NAME_CHARS,"}

exempt:
  - format: ::can::CanFrameLog::FORMAT
    files: [platforms/s32k1xx/port/main/src/systems/CanSystem.cpp]
    evidence: >
      can log lines (COM-25): "%s" with a line of at most LINE_CAPACITY - 1 characters, checked at compile time
      against MaxEntrySize of the real logger type and in the host test can-frame-log.
    proof:
      - {kind: contains, file: platforms/s32k1xx/port/main/src/systems/CanSystem.cpp,
         text: "static_assert( ::can::CanFrameLog::entryBytes(LoggerLimits::LENGTH_BYTES, LoggerLimits::TIMESTAMP_BYTES)
                <= LoggerLimits::MAX_ENTRY_BYTES,"}
  - format: message
    files: [ecu/application/src/logger/logger.cpp]
    evidence: >
      lwIP callbacks log_lwipInfo/log_lwipError: the format comes from lwIP (third party, only with
      PLATFORM_SUPPORT_ETHERNET); no own code calls them.
    proof:
      - kind: confined
        pattern: '\blog_lwip(Info|Error)\b'
        files: [ecu/application/src/logger/logger.cpp]
