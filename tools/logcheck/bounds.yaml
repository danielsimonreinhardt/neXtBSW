          - "static_assert(textLength(#bus) <= ::can::CanFrameLog::BUS_NAME_CHARS, \"CAN bus name \" #bus \" longer"
          - "NX_CAN_BUSES(NX_CAN_CHECK_NAMES)"

  - expr: bus
