      - {kind: contains, file: ecu/uds/src/uds/app/BootloaderIdentification.cpp,
         text: ["&& ((end - pos) < BOOTLOADER_VERSION_MAX_LENGTH))", "(area[end] == 0U)"]}
      - {kind: contains, file: ecu/uds/src/uds/app/DiagStack.cpp,
         text: "_values.bootSoftwareId = findBootloaderVersion(bootloaderArea);"}

