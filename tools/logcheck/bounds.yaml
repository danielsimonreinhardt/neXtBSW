# SPDX-License-Identifier: Apache-2.0
# Upper bounds of "%s" arguments and format macros of the logger calls (SYS-16), read by tools/logcheck.
#
# A logger call puts its format string and every "%s" argument as a copy into ONE entry of 128 bytes; a string
# without a known upper bound can cut the line to "<?>" (IO-25, COM-25). String literals and conditional
# expressions of literals are measured by the tool itself. Everything else needs an entry here - with a proof the
# tool checks on every run, so a bound cannot silently go stale:
#
#   function   file + pattern (regex of the definition): every return of the function is a string literal (or one
#              of allowed_returns, e.g. an element of a local table of literals), and no literal in its body is
#              longer than max
#   functions  pattern only: the same for every definition in the repository (tests and external/ excluded),
#              e.g. all overrides of an interface method
#   assigned   file + variable: every assignment "variable = ...;" is a string literal of at most max characters
#   contains   file + text (string or list): the file contains the text (whitespace ignored, comments removed
#              unless raw: true) - used for the static_asserts that bound names from the configuration
#   confined   pattern + files: no other source uses the pattern (the object is not created anywhere else yet);
#              the first new user has to bound the string there and extend the rule
#
# strings:  expr = argument expression as written in the call (whitespace ignored), files = calls it applies to
# macros:   name = macro inside a format string ("UDS on " NX_UDS_BUS_NAME ...), counted with max characters
# exempt:   format = format expression of calls the tool cannot evaluate, with the proof of their own check

strings:
  # ------------------------------------------------------------------ names from the configuration
  - expr: _names.label
    files: [libs/bsw/highSideSwitch/src/highSideSwitch/HighSideSwitchSystem.cpp]
    max: 16
    evidence: >
      Label of a high-side switch instance (generated NX_DEVICE_<device>_LABEL). HighSideSwitchNames::LABEL_MAX_CHARS
      is the contract of the library. ARCH-66: the system is created only by the binding trait of the module (generated
      integration, integration/moduleBinding.h), which checks every instance with static_assert(hasValidLabel()) on
      exactly the names it hands the system.
    proof:
      - {kind: contains, file: libs/bsw/highSideSwitch/include/highSideSwitch/HighSideSwitchNames.h,
         text: "static constexpr size_t LABEL_MAX_CHARS = 16U;"}
      - kind: contains
        file: libs/bsw/highSideSwitch/include/highSideSwitch/HighSideSwitchBinding.h
        text:
          - "static_assert( hasValidLabel(Instance<I>::NAMES),"
          - "return storage.create(context, parts, Instance<I>::CONFIG, Instance<I>::NAMES);"
      - kind: confined
        pattern: '\bHighSideSwitchNames\b'
        files:
          - libs/bsw/highSideSwitch/include/highSideSwitch/HighSideSwitchNames.h
          - libs/bsw/highSideSwitch/include/highSideSwitch/HighSideSwitchSystem.h
          - libs/bsw/highSideSwitch/include/highSideSwitch/HighSideSwitchIntegration.h
          - libs/bsw/highSideSwitch/include/highSideSwitch/HighSideSwitchBinding.h
          - libs/bsw/highSideSwitch/src/highSideSwitch/HighSideSwitchSystem.cpp

  - expr: _names.label
    files: [platforms/s32k1xx/port/main/src/systems/GateDriverSystem.cpp]
    max: 16
    evidence: >
      Label of a TMC6200 instance = its instance name (#device); Integration.cpp asserts every instance against
      GATE_DRIVER_LABEL_MAX_CHARS.
    proof:
      - kind: contains
        file: platforms/s32k1xx/port/main/src/integration/Integration.cpp
        text:
          - "constexpr size_t GATE_DRIVER_LABEL_MAX_CHARS = 16U;"
          - "= {NX_DEVICE_##device##_PARAM_CONSOLE, #device, \"TMC6200 gate driver \" #device};"
          - "static_assert(sizeof(#device) - 1U <= GATE_DRIVER_LABEL_MAX_CHARS,"
      - kind: confined
        pattern: '\bGateDriverNames\b'
        files:
          - platforms/s32k1xx/port/main/include/systems/GateDriverSystem.h
          - platforms/s32k1xx/port/main/src/systems/GateDriverSystem.cpp
          - platforms/s32k1xx/port/main/src/integration/Integration.cpp

  - expr: INTN1_INPUT_NAME
    files: [platforms/s32k1xx/port/main/src/systems/SbcSystem.cpp]
    max: 32
    evidence: >
      IO-68: name of the board input wired to INTN1 of the SBC (generated NX_DEVICE_<sbc>_IO_INTN1, stringified), or
      "" without the connection. SbcSystem.cpp asserts its length against INTN1_INPUT_NAME_MAX_CHARS at compile time.
    proof:
      - kind: contains
        file: platforms/s32k1xx/port/main/src/systems/SbcSystem.cpp
        text:
          - "constexpr size_t INTN1_INPUT_NAME_MAX_CHARS = 32U;"
          - "nameLength(INTN1_INPUT_NAME) <= INTN1_INPUT_NAME_MAX_CHARS,"

  - expr: _names.label
