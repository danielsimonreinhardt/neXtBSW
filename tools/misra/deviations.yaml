    rule: badBitmaskCheck
    files: [libs/bsw/dem/include/dem/SafetyResetReport.h]
    pattern: '^CAUSE_EVENT \| 0x00U,'
    limit: 1
    reason: >-
      Tabelle der Ursachencodes (SYS-113): jede Zeile ist CAUSE_EVENT | Nummer des SafeSupervisor::Event, wie
      SafeSupervisor.cpp den Code bildet (CAUSE_EVENT | to_underlying(event)). Die Zeile fuer Event 0
      (SAFETY_MANAGER_SEQUENCE_DEVIATION) schreibt die 0 aus, damit alle Zeilen dieselbe Form haben und sich gegen die
      Aufzaehlung pruefen lassen. Der Wert ist richtig (0x100), die Oder-Verknuepfung mit 0 ist gewollt.
    raised_by: REL-R1 (Agent)
    date: 2026-10-05
    approved_by: "Nutzer (Safety Responsible) 2026-10-05, Entscheidungsboard-Item rc1-statik-abweichungen-1005: alle 7 Abweichungen freigeben, Baseline aktualisieren"
    task: REL-R1

  - id: DEV-027
    kind: deviation
    rule: misra-c2012-17.2
    files: [platforms/s32k1xx/port/main/src/systems/SbcSystem.cpp]
    pattern: '\bsameName\(a \+ 1, b \+ 1\)|\bnameLength\(s \+ 1\)'
    limit: 2
    reason: >-
      Rekursion nur zur Uebersetzungszeit (IO-68): sameName() und nameLength() sind constexpr und werden nur in
      konstanten Ausdruecken ausgewertet (constexpr INTN1_PIN_EVENT = intn1PinEvent() und ein static_assert auf die
      Laenge des Eingangsnamens). Zur Laufzeit wird keine der beiden aufgerufen; es entsteht kein Objektcode und
      kein Stapelbedarf. Die Tiefe ist durch Zeichenkettenkonstanten der Konfiguration begrenzt (<= 32 Zeichen).
    raised_by: REL-R1 (Agent)
    date: 2026-10-05
    approved_by: "Nutzer (Safety Responsible) 2026-10-05, Entscheidungsboard-Item rc1-statik-abweichungen-1005: alle 7 Abweichungen freigeben, Baseline aktualisieren"
    task: REL-R1

  - id: DEV-028
    kind: false-positive
    rule: knownConditionTrueFalse
    files: [platforms/s32k1xx/port/main/src/systems/SbcSystem.cpp]
    pattern: '^wakeArmed \? "armed" : "not armed"\);$'
    limit: 1
    reason: >-
      Abhaengig von der Konfiguration: isMcuWakeLineArmed() liefert nur mit einem Pin-Ereignis am INTN1-Eingang
      (project.yaml pin_events, NX_PIN_EVENT_COUNT > 0) einen Wert der Pin-Statistik. Im Demo-Projekt gibt es keine
      pin_events, die Funktion liefert dort immer false. Ausserdem setzt ein Lambda den Wert im Task des SBC
      (inSbcTask/runInOwnerContext), und cppcheck verfolgt das nicht. Es ist nur der Text der Konsole "sbc status".
    raised_by: REL-R1 (Agent)
    date: 2026-10-05
    approved_by: "Nutzer (Safety Responsible) 2026-10-05, Entscheidungsboard-Item rc1-statik-abweichungen-1005: alle 7 Abweichungen freigeben, Baseline aktualisieren"
    task: REL-R1

  - id: DEV-029
    kind: false-positive
    rule: knownConditionTrueFalse
    files: [platforms/s32k1xx/port/safety/safeLifecycle/src/safeLifecycle/SafetyManager.cpp]
    pattern: '^if \(safeOffReports != nullptr\)$'
    limit: 1
    reason: >-
      Wie DEV-017: safety::safeOffReportBox() hat in derselben Uebersetzungseinheit einen schwachen Vorgabewert
      (__attribute__((weak)), liefert nullptr). cppcheck kennt weak nicht. Beim Binden gewinnt die starke Definition
      in platforms/s32k1xx/port/main/src/integration/Integration.cpp (Postfach der Halteschaltung, SYS-194) und liefert
      einen Zeiger; ohne sie (Port ohne safe_off-Halt) bleibt es nullptr. Beide Zweige sind wirksam;
      test_safety_context.py prueft am Abbild genau eine starke Definition.
    raised_by: REL-R1 (Agent)
    date: 2026-10-05
    approved_by: "Nutzer (Safety Responsible) 2026-10-05, Entscheidungsboard-Item rc1-statik-abweichungen-1005: alle 7 Abweichungen freigeben, Baseline aktualisieren"
    task: REL-R1

  - id: DEV-030
    kind: false-positive
    rule: clang-analyzer-security.ArrayBound
    files: [platforms/s32k1xx/port/safety/safeMemory/src/safeMemory/MemoryProtection.cpp]
    pattern: 'memoryProtectionConfigurationRam\[region\]\.word[23]\.R\b'
    limit: 2
    reason: >-
      checkLockProtection() und checkValidity() sind private static und werden nur aus areRegionsConfiguredCorrectly()
      in der Schleife i < numOfMemoryProtectionConfigurationRamRegions aufgerufen. Das ist genau die Groesse des Feldes
      (7); Deskriptor region + 1 liegt in 1..7, und static_assert sichert (7 + 1) <= SMPU_ENTRYS. Der Analysator
      beginnt den Pfad in der Funktion selbst, ohne Aufrufer, und nimmt fuer region jeden uint8_t-Wert an. Derselbe
      Befund stand vor SYS-171 in der Baseline; SYS-171 hat nur den Text der Zeile geaendert (alle WORD2-Felder statt
      mask_available_regions).
    raised_by: REL-R1 (Agent)
    date: 2026-10-05
    approved_by: "Nutzer (Safety Responsible) 2026-10-05, Entscheidungsboard-Item rc1-statik-abweichungen-1005: alle 7 Abweichungen freigeben, Baseline aktualisieren"
    task: REL-R1

  - id: DEV-031
    kind: false-positive
    rule: knownConditionTrueFalse
    files: [platforms/s32k1xx/port/safety/safeSupervisionCheck/src/safeSupervisionCheck/LpitDeadmanProgress.cpp]
    pattern: '^if \(now != first\)$'
    limit: 1
    reason: >-
      Wie DEV-007: LPIT0->TMR[n].CVAL ist im Herstellerkopf __I (volatile const) und zaehlt in der Hardware weiter.
      cppcheck 2.17 setzt zwei Lesevorgaenge desselben volatile-Registers gleich und haelt now != first fuer immer
      falsch. Auf dem Target liest jede Schleifenrunde das Register neu; MOVING wird erkannt (SYS-95, DFA-2).
    raised_by: REL-R1 (Agent)
    date: 2026-10-05
    approved_by: "Nutzer (Safety Responsible) 2026-10-05, Entscheidungsboard-Item rc1-statik-abweichungen-1005: alle 7 Abweichungen freigeben, Baseline aktualisieren"
    task: REL-R1
