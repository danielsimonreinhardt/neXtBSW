# Abweichungsliste der statischen Analyse (PLAT-74) - maschinenlesbar, geprueft von `python -m tools.misra check`.
#
# Ein Eintrag ist eine begruendete, dauerhafte Abweichung (MISRA Compliance:2020 "deviation record") oder ein
# nachgewiesener Fehlalarm des Werkzeugs (kind: false-positive). Er ist KEIN Ort fuer echte Fehler: die stehen mit
# `defect:` in baseline.yaml und gehoeren in eine Aufgabe.
#
# Felder:
#   id           DEV-nnn, wird nie wiederverwendet
#   kind         deviation | false-positive
#   rule         Regel-Kennung(en) des Werkzeugs (Muster mit * erlaubt)
#   files        Dateien/Muster (** ueber Verzeichnisse)
#   pattern      regulaerer Ausdruck auf die Quellzeile des Befunds - und/oder
#   symbol       Bezeichner, der in der Quellzeile oder der Meldung vorkommen muss
#                (Ort nie nur ueber eine Zeilennummer, nie nur ueber eine Datei)
#   limit        hoechstens so viele Treffer - weitere derselben Art sind neue Befunde
#   reason       Begruendung (eigene Worte, keine Regeltexte)
#   raised_by    Wer hat sie aufgestellt,  date: Wann
#   approved_by  Freigabe (leer = offen; der Lauf warnt, bricht aber nicht)
#   task         Aufgabe
version: 1
deviations:
  - id: DEV-001
    kind: deviation
    rule: misra-c2012-20.7
    files: [libs/bsw/autosarBase/include/Compiler.h]
    pattern: '^#define (FUNC|FUNC_P2CONST|FUNC_P2VAR|P2VAR|P2CONST|CONSTP2VAR|CONSTP2CONST|P2FUNC|CONSTP2FUNC|CONST|VAR)\('
    limit: 11
    reason: >-
      AUTOSAR Compiler Abstraction: die Makros setzen einen Typ zusammen (FUNC(rettype, memclass) -> rettype).
      Ein Typname kann nicht geklammert werden; die Form ist durch die AUTOSAR-Spezifikation vorgegeben und wird
      von generiertem Code (RTE, Simulink) so erwartet.
    raised_by: PLAT-74 (Agent)
    date: 2026-09-21
    approved_by: "Nutzer 2026-09-21 (Entscheidungsboard plat74-abweichungen)"
    task: PLAT-74

  - id: DEV-002
    kind: deviation
    rule: [misra-c2012-11.4, clang-analyzer-core.FixedAddressDereference, cstyleCast,
           cppcoreguidelines-pro-type-cstyle-cast]
    files: ["bootloader/platforms/**", "bootloader/updater/platforms/**", "platforms/*/port/**", "platforms/*/bsp/**",
            "platforms/*/hardFaultHandler/**"]
    pattern: '\b(?:[A-Z][A-Za-z0-9_]*|can)\s*->|\b[A-Z][A-Z0-9_]*_Type\s*[&*]|\bIP_|\bBL_SBC_SPI\b|\bNX_SAFE_OUTPUT_REG\(|_INSTANCES\('
    reason: >-
      Zugriff auf Peripherie-Register ueber die Registerbloecke des Herstellerkopfs (IP_FTFC->FSTAT, SysTick->VAL,
      LPIT0->MCR) bzw. die daraus erzeugten Adressmakros. Die Registerbloecke liegen an festen Adressen; der Cast
      steckt im Makro des Herstellers (CMSIS/NXP) und ist die einzige Art, memory-mapped Register in C/C++ zu
      erreichen. Nur in Plattform-, Bootloader-Plattform- und Fault-Handler-Code - wiederverwendbare Treiber
      (libs/) greifen ueber Schnittstellen zu.
    raised_by: PLAT-74 (Agent)
    date: 2026-09-21
    approved_by: "Nutzer 2026-09-21 (Entscheidungsboard plat74-abweichungen)"
    task: PLAT-74

