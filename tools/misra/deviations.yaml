            platforms/s32k1xx/port/main/src/sbc/SbcEarlyStart.cpp]
    pattern: '\(uint(8|32)_t(\s+const)?\s*\*\)\s*\(?(address|appStart|BL_BOOT_REQUEST_ADDR)|\bflag\[0\]|\bBL_UID_WORD\(|\bFAIL_START_RECORD\['
    limit: 14
    reason: >-
      Feste Speicherstellen des Speicherlayouts: Flash lesen ueber seine Adresse (hal_flash_ptr/upd_flash_ptr,
      Vergleich nach dem Schreiben), Vektortabelle der Anwendung vor dem Sprung, Boot-Anforderung und
      Fehlstart-Zaehler an der vom Generator festgelegten RAM-Adresse (noinit), eindeutige Kennung aus dem
      Flash-IFR. Die Adressen kommen aus einer Quelle (bl_memory.h, ARCH-08) und sind im Linker reserviert.
    raised_by: PLAT-74 (Agent)
    date: 2026-09-21
    approved_by: "Nutzer 2026-09-21 (Entscheidungsboard plat74-abweichungen)"
    task: PLAT-74

