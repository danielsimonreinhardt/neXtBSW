  - id: DEV-024
    kind: deviation
    rule: cert-dcl54-cpp
    files: [platforms/s32k1xx/port/main/src/cxxRuntime/NoHeapOperatorDelete.cpp]
    pattern: '^__attribute__\(\(noinline\)\) void operator delete\(void\* const pointer\) noexcept$'
    limit: 1
    reason: >-
      Kein Heap (NXCPP-05): das eigene operator delete (DOC-28) gibt es nur, weil jeder virtuelle Destruktor einen
      loeschenden Destruktor mit Aufruf von operator delete erzeugt; es kehrt nie zurueck (Reaktion S1 + S2). Ein
      passendes operator new wird absichtlich nicht definiert: ein new-Ausdruck oder eine allozierende
      Bibliotheksfunktion soll das malloc der Bibliothek ins Abbild ziehen, damit tools/elfcheck (heap-symbol)
      den Bau rot macht - ein eigenes operator new verschoebe diese Erkennung vom Bau in die Laufzeit. Die Regel
      schuetzt vor einem Paar aus fremdem new und eigenem delete; ohne Allokation gibt es kein solches Paar.
    raised_by: REL-020 (Agent)
    date: 2026-10-01
    approved_by: "Nutzer 2026-10-01 (Freigabe im Chat fuer die Release-CI v0.2.0, alle drei wie empfohlen)"
    task: REL-020

