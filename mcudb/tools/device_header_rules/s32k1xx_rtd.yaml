# Adapter rules for the NXP RTD device headers of the s32k1xx family from Zephyr hal_nxp (PLAT-32).
#
# Tool: mcudb/tools/rtd_adapter.py (generate | check | symbols). Origin, license and file list of the vendor headers:
# platforms/s32k1xx/bsp/bspMcu/include/3rdparty/nxp/rtd/README.md.
#
# Target names are those of the S32K148.h the OpenBSW s32k1xx drivers are written against (external/openbsw/
# platforms/s32k1xx/bsp/bspMcu/include/3rdparty/nxp/S32K148.h, rev. 1.1a, BSD-3-Clause). The vendor files stay
# unchanged; every difference is handled here, once per module, not per used symbol:
#   modules.<M>.vendor_type/type     layout copy under the driver type name (vendor type name redirected to it)
#   modules.<M>.members              member of the vendor layout replaced by one of the same size (offsets proven)
#   modules.<M>.append               member behind the vendor layout (offset given and proven)
#   modules.<M>.macro_prefix         every macro of the vendor module file with the prefix also under the driver prefix
#   derivatives.<D>.core             values of the vendor header that are wrong for the derivative (with source)
#   derivatives.<D>.absent           instances the vendor header describes but the derivative does not have
#   derivatives.<D>.compat           macros for bits that are reserved on the derivative but written by shared code
#                                    (each one an open point against that code, with reason)
#   derivatives.<D>.not_on_derivative
#                                    driver symbols that do not resolve because the hardware is not there (reason);
#                                    `check` fails for any other unresolved symbol and for patterns that match nothing
schema_version: 1
family: s32k1xx
origin:
  repository: https://github.com/zephyrproject-rtos/hal_nxp
  commit: bb740b2e6dd0a192130caf76d45f1a8f40050346
  path: s32/drivers/s32k1/BaseNXP/header
  license: BSD-3-Clause
  license_file: {name: LICENSE.BSD-3, sha256: 85fe643c33c6ea5d81a6c5db68cbb2fdcc811a63233febf367a2574eb1c5d9b3}
include_dir: platforms/s32k1xx/bsp/bspMcu/include
vendor_dir: 3rdparty/nxp/rtd

modules:
  FLEXCAN:
    why: RTD names the module CAN (CAN_Type, CAN_*) and the message buffer RAM MB[]; the drivers use FLEXCAN_* and RAMn[]
    vendor_type: CAN_Type
    type: FLEXCAN_Type
    members:
      # MB[32] (4 words each) and RAMn[CAN_RAMn_COUNT = 128] are the same 0x200 bytes at 0x80
      - match: 'struct \{[^{}]*\}\s*MB\[32\];[^\n]*'
        replace: '__IO uint32_t RAMn[CAN_RAMn_COUNT];'
        why: Message buffer RAM as words, as in S32K148.h (bootloader hal_s32k1xx.c)
    macro_prefix:
      - {vendor: CAN_, driver: FLEXCAN_}
  ADC:
    why: RTD has one SC1[] field set (ADC_SC1_*); the drivers use the names of the first element (ADC_SC1A_*)
    macro_prefix:
      - {vendor: ADC_SC1_, driver: ADC_SC1A_}
  ERM:
    why: RTD has EAR[] as plain array; the drivers use the cluster EARn[].EAR of S32K148.h
    vendor_type: ERM_Type
    type: ERM_Type
    members:
      - match: '__I\s+uint32_t\s+EAR\[ERM_EARn_COUNT\];[^\n]*'
        replace: 'struct { __I uint32_t EAR; } EARn[ERM_EARn_COUNT];'
        why: EARn[n].EAR as in S32K148.h (safeMemory IntegrityEccHandler.cpp)
  GPIO:
    why: RTD S32K116_GPIO.h leaves out PIDR, which S32K11x has (S32K1xx RM Rev. 14, 13.3.1.1 GPIO memory map, offset 18h)
    vendor_type: GPIO_Type
    type: GPIO_Type
    append:
      - decl: '__IO uint32_t PIDR;'
        offset: 0x18
        why: >-
          Port Input Disable Register, S32K1xx RM Rev. 14, 13.3.1.1 and 13.3.1.8 (offset 18h, all S32K1xx); 13.1 note:
          on S32K11x PIDR cannot be set to 1 in GPIO mode (bspIo Io.cpp writes it)

derivatives:
  S32K116:
    header: 3rdparty/nxp/S32K116.h
    include: [S32K116.h]
    core:
      __NVIC_PRIO_BITS:
        value: 2U
        source: >-
          RTD S32K116_COMMON.h says 4; the Cortex-M0+ implements 2 priority bits: S32K1xx RM Rev. 14, 8.2.1 (p. 123)
          "This device supports four priority levels"; Keil S32K116.svd 1.6 nvicPrioBits 2; mcudb nvic_priority_bits 2
    absent:
      LMEM: S32K1xx RM Rev. 14, 33.1 (p. 721) "Variants of S32K11x series do not have LMEM" (RTD S32K116_LMEM.h has it)
    not_on_derivative:
      - {match: 'SIM_CHIPCTL_PDB_BB_SEL_MASK',
         why: "bit 13 of SIM_CHIPCTL (PDB_BB_SEL) is reserved on S32K11x (RM Rev. 14, 11.1.1.1.4), RTD S32K116_SIM.h has no macro; bsp/adc/AnalogInput.cpp clears it only #ifdef SIM_CHIPCTL_PDB_BB_SEL_MASK (PLAT-48)"}
      - {match: 'ENET_\w+|IP_ENET|\.(EIMR|EIR|GALR|GAUR|IALR|IAUR|MIBC|MRBR|MSCR|OPD|PALR|PAUR|RACC|RCR|RDAR|RDSR|TACC|TCR|TDAR|TDSR|TFWR)',
         why: "no ENET on S32K11x (RM Rev. 14, Figure 2-3 module availability); bspEthernet is not built"}
      - {match: 'IP_(ADC1|FTM[2-5]|LPSPI[12]|LPUART2)|PCC_(ADC1|FTM[2-5]|LPSPI[12]|LPUART2|FlexCAN[12]|PDB1|ENET|EWM)_INDEX',
         why: "instances the S32K116 does not have (mcudb/s32k1xx/S32K116.yaml peripherals); mcu.h and bspClock guard them"}
      - {match: 'IP_LMEM',
         why: "removed by absent.LMEM; mcu.h defines LMEM only #ifdef IP_LMEM, the cache driver is cacheUnavailable.cpp"}
      - {match: 'SCG_SPLL\w+|\.SPLL(CFG|CSR|DIV)',
         why: "no SPLL on S32K11x (RM Rev. 13, 28.1 p. 579); bspClock guards with PLL_AVAILABLE (finding PLAT-11)"}
      - {match: 'LPIT0_Ch1_IRQn',
         why: "the S32K11x gives all LPIT channels one vector and names it LPIT_IRQn (RM Rev. 14, Table 3-3 interrupt vector assignments); bswgen defines LPIT0_Ch1_IRQn as LPIT_IRQn in mcu/mcuDerivative.h (FAMILY_IRQ_ALIASES), the debug halt guard uses the family name (IO-32)"}
      - {match: 'RCM_SRS_LOL_MASK',
         why: "no SPLL on S32K11x (RM Rev. 13, 28.1 p. 579), so no loss-of-lock reset source; McuResetReason.cpp checks the bit position only #ifdef RCM_SRS_LOL_MASK (RTE-16)"}
      - {match: 'ERM_SR0_(NCE1|SBC1)_MASK',
         why: "one ERM memory channel on S32K11x (RTD ERM_EARn_COUNT 1); IntegrityEccHandler.cpp guards NCE1/SBC1 with #ifdef (SYS-41)"}
      - {match: 'EIM_EICHEN_EICH1EN_MASK|ERM_CR0_(ESCIE1|ENCIE1)_MASK',
         why: "EIM and ERM channel 1 are reserved on S32K11x (RM Rev. 13, Tables 21-1 and 22-1: one RAM array, SRAM_U, on channel 0; RTD EIM_EICHDn_COUNT and ERM_EARn_COUNT 1); EccLatentTest.cpp uses channel 1 only #if ERM_EARn_COUNT > 1 (SYS-73)"}
      - {match: 'WDOG_EWM_IRQn',
         why: "S32K11x has no EWM, the vector is WDOG_IRQn; bswgen maps the name in mcu/mcuDerivative.h (FAMILY_IRQ_ALIASES)"}
